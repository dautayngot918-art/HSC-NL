 <meta name="apple-mobile-web-app-capable" content="yes">
 <meta name="apple-mobile-web-app-status-bar-style" content="default">
 <meta name="apple-mobile-web-app-title" content="Loét tì đè HSTC">
 <meta name="mobile-web-app-capable" content="yes">
 <meta name="format-detection" content="telephone=no">
 <style>:root{padding-top:env(safe-area-inset-top,0px)} body{min-height:100vh;min-height:100dvh} html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
 <link rel="manifest" href="manifest.webmanifest">
 <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
 <link rel="apple-touch-icon" href="icons/icon-180.png">

 <title>Phòng ngừa Loét Tì Đè - Khoa Hồi Sức Tích Cực</title>
 <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
 <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
 <style>
 :root{
   --ink:#0f1e21; --ink-2:#3d5155; --ink-3:#6b8084;
   --bg:#f2f6f5; --card:#ffffff; --card-2:#f7faf9;
   --line:#dbe5e3; --line-2:#c6d4d2;
   --accent:#0d7a76; --accent-ink:#ffffff; --accent-soft:#e2f0ef; --accent-2:#0a5f5c;
   --focus:#0d7a76;
   --r0:#1a8f5a; --r0-bg:#e4f4ec; --r0-ink:#0c5c39;
   --r1:#d4a017; --r1-bg:#fbf1d9; --r1-ink:#73560a;
   --r2:#e2590f; --r2-bg:#fdeae0; --r2-ink:#8a3408;
   --r3:#ad2040; --r3-bg:#fce8ec; --r3-ink:#7a1630;
   --ord1:#e0a15c; --ord2:#cc7a2c; --ord3:#a85720; --ord4:#7a3517;
   --s1:#2a78d6; --s2:#eb6834;
   --grid:#e4ebea; --axis:#c6d4d2; --muted:#7d9296;
   --good:#1a8f5a; --warn:#d4a017; --bad:#ad2040;
   --shadow:0 1px 2px rgba(15,30,33,.05), 0 8px 24px -12px rgba(15,30,33,.14);
   --shadow-lg:0 2px 4px rgba(15,30,33,.06), 0 24px 48px -20px rgba(15,30,33,.24);
   --r-sm:8px; --r-md:12px; --r-lg:18px;
   --sans:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
   --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
 }
 @media (prefers-color-scheme:dark){
   :root:not([data-theme="light"]){
     --ink:#e6eeed; --ink-2:#a9bcbe; --ink-3:#83989c;
     --bg:#0f1516; --card:#1b2426; --card-2:#202b2d;
     --line:#2b3739; --line-2:#3a494b;
     --accent:#2aa39d; --accent-ink:#07211f; --accent-soft:#12302f; --accent-2:#3fbdb6;
     --focus:#2aa39d;
     --r0:#33b077; --r0-bg:#11301f; --r0-ink:#7fd7a9;
     --r1:#e0b42f; --r1-bg:#2e2608; --r1-ink:#efd27a;
     --r2:#f2742e; --r2-bg:#331a0b; --r2-ink:#f7ab7c;
     --r3:#dc4a68; --r3-bg:#33131c; --r3-ink:#f096a6;
     --ord1:#8a4f1c; --ord2:#b06a26; --ord3:#d18a3f; --ord4:#eeb272;
     --s1:#3987e5; --s2:#d95926;
     --grid:#273335; --axis:#3a494b; --muted:#83989c;
     --good:#33b077; --warn:#e0b42f; --bad:#dc4a68;
     --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
     --shadow-lg:0 2px 4px rgba(0,0,0,.5), 0 24px 48px -20px rgba(0,0,0,.7);
   }
 }
 :root[data-theme="dark"]{
   --ink:#e6eeed; --ink-2:#a9bcbe; --ink-3:#83989c;
   --bg:#0f1516; --card:#1b2426; --card-2:#202b2d;
   --line:#2b3739; --line-2:#3a494b;
   --accent:#2aa39d; --accent-ink:#07211f; --accent-soft:#12302f; --accent-2:#3fbdb6;
   --focus:#2aa39d;
   --r0:#33b077; --r0-bg:#11301f; --r0-ink:#7fd7a9;
   --r1:#e0b42f; --r1-bg:#2e2608; --r1-ink:#efd27a;
   --r2:#f2742e; --r2-bg:#331a0b; --r2-ink:#f7ab7c;
   --r3:#dc4a68; --r3-bg:#33131c; --r3-ink:#f096a6;
   --ord1:#8a4f1c; --ord2:#b06a26; --ord3:#d18a3f; --ord4:#eeb272;
   --s1:#3987e5; --s2:#d95926;
   --grid:#273335; --axis:#3a494b; --muted:#83989c;
   --good:#33b077; --warn:#e0b42f; --bad:#dc4a68;
   --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
   --shadow-lg:0 2px 4px rgba(0,0,0,.5), 0 24px 48px -20px rgba(0,0,0,.7);
 }
 *{box-sizing:border-box}
 html,body{height:100%}
 body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
 button,input,select,textarea{font:inherit;color:inherit}
 button{cursor:pointer}
 h1,h2,h3,h4{margin:0;font-weight:600;text-wrap:balance;letter-spacing:-.011em}
 p{margin:0}
 a{color:var(--accent);text-underline-offset:2px}
 :focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
 .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
 .tnum{font-variant-numeric:tabular-nums}
 .sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
 @media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
 
 /* Khung ứng dụng */
 #app{min-height:100%;display:flex;flex-direction:column}
 .shell{display:flex;min-height:100%;flex:1}
 .main{flex:1;min-width:0;display:flex;flex-direction:column}
 .topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--card);background:color-mix(in srgb,var(--card) 88%,transparent);-webkit-backdrop-filter:saturate(1.6) blur(12px);backdrop-filter:saturate(1.6) blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:10px 16px;min-height:56px}
 .topbar h1{font-size:16px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
 .topbar .sub{font-size:11.5px;color:var(--ink-3);font-weight:400;display:block;letter-spacing:.02em}
 .iconbtn{width:38px;height:38px;display:grid;place-items:center;border:1px solid var(--line);background:var(--card);border-radius:10px;color:var(--ink-2);flex:none}
 .iconbtn:hover{border-color:var(--line-2);color:var(--ink)}
 .iconbtn svg{width:19px;height:19px;flex:none}
 .content{flex:1;padding:16px 16px 92px;width:100%;max-width:1280px;margin:0 auto}
 .page{display:flex;flex-direction:column;gap:16px}
 
 /* Tabbar mobile */
 .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);transform:translateZ(0)}
 .tabbar button{flex:1;border:0;background:none;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink-3);font-size:10.5px;font-weight:500;position:relative}
 .tabbar button[aria-current="page"]{color:var(--accent)}
 .tabbar button[aria-current="page"]::before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:26px;height:2.5px;border-radius:0 0 3px 3px;background:var(--accent)}
 .tabbar svg{width:22px;height:22px}
 .tabbar .dot{position:absolute;top:5px;right:calc(50% - 18px);min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--bad);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;font-family:var(--mono)}
 
 /* Thẻ thành phần */
 .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px}
 .card-h{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
 .card-h h2{font-size:14px;letter-spacing:.01em}
 .card-h .hint{font-size:12px;color:var(--ink-3);margin-left:auto;font-weight:400}
 .eyebrow{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
 .divider{height:1px;background:var(--line);border:0;margin:14px 0}
 
 /* Khối ô (Tiles) */
 .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
 .tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:13px 14px;display:flex;flex-direction:column;gap:3px;min-width:0;text-align:left}
 .tile .lab{font-size:11.5px;color:var(--ink-3);font-weight:500;line-height:1.3}
 .tile .val{font-size:27px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
 .tile .note{font-size:11.5px;color:var(--ink-3)}
 .tile.tap{cursor:pointer}
 .tile.tap:hover{border-color:var(--line-2)}
 .tile.alert .val{color:var(--bad)}
 .tile.warnT .val{color:var(--r2-ink)}
 
 /* Nút bấm */
 .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:11px;border:1px solid var(--line-2);background:var(--card);color:var(--ink);padding:10px 15px;font-weight:500;font-size:14px;min-height:42px;transition:.12s}
 .btn:hover{border-color:var(--ink-3)}
 .btn:active{transform:translateY(1px)}
 .btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
 .btn.pri:hover{background:var(--accent-2);border-color:var(--accent-2)}
 .btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
 .btn.ghost{border-color:transparent;background:transparent;color:var(--accent)}
 .btn.sm{min-height:34px;padding:6px 11px;font-size:13px;border-radius:9px}
 .btn.block{width:100%}
 .btn[disabled]{opacity:.45;pointer-events:none}
 .btn svg{width:17px;height:17px;flex:none}
 .btnrow{display:flex;gap:8px;flex-wrap:wrap}
 
 /* Biểu mẫu */
 .field{display:flex;flex-direction:column;gap:5px;min-width:0}
 .field>label{font-size:12.5px;font-weight:600;color:var(--ink-2)}
 .field .help{font-size:11.5px;color:var(--ink-3)}
 input[type=text],input[type=password],input[type=number],input[type=date],input[type=search],select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line-2);border-radius:10px;background:var(--card);min-height:42px;font-size:15px}
 textarea{min-height:76px;resize:vertical;line-height:1.5}
 input::placeholder,textarea::placeholder{color:var(--ink-3)}
 .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
 .grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
 
 /* Bảng lựa chọn Waterlow & Khám da */
 .qblock{border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;background:var(--card)}
 .qblock+.qblock{margin-top:10px}
 .qhead{display:flex;align-items:center;gap:9px;padding:11px 13px;background:var(--card-2);border-bottom:1px solid var(--line)}
 .qnum{width:22px;height:22px;border-radius:7px;background:var(--accent-soft);color:var(--accent);font-size:11.5px;font-weight:700;display:grid;place-items:center;flex:none;font-family:var(--mono)}
 .qhead .t{font-size:13.5px;font-weight:600;flex:1;min-width:0}
 .qhead .pts{font-family:var(--mono);font-size:12.5px;font-weight:600;color:var(--ink-3);background:var(--card);border:1px solid var(--line);border-radius:7px;padding:2px 7px;flex:none}
 .qhead .pts.on{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
 .qopts{display:flex;flex-direction:column;padding:5px}
 .opt{display:flex;align-items:center;gap:10px;padding:10px 9px;border-radius:9px;border:1px solid transparent;background:none;text-align:left;width:100%;min-height:44px;transition:.1s}
 .opt:hover{background:var(--card-2)}
 .opt .mark{width:20px;height:20px;border-radius:50%;border:1.8px solid var(--line-2);flex:none;display:grid;place-items:center;transition:.12s}
 .opt.multi .mark{border-radius:6px}
 .opt .mark svg{width:12px;height:12px;opacity:0;color:#fff}
 .opt .txt{flex:1;min-width:0;font-size:14px;line-height:1.35}
 .opt .p{font-family:var(--mono);font-size:12.5px;font-weight:600;color:var(--ink-3);flex:none;min-width:26px;text-align:right}
 .opt[aria-pressed="true"]{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
 .opt[aria-pressed="true"] .mark{background:var(--accent);border-color:var(--accent)}
 .opt[aria-pressed="true"] .mark svg{opacity:1}
 .opt[aria-pressed="true"] .p{color:var(--accent)}
 
 /* Nhãn mức nguy cơ (Pill) */
 .pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px 3px 8px;font-size:12px;font-weight:600;border:1px solid transparent;white-space:nowrap}
 .pill .bullet{width:8px;height:8px;border-radius:50%;flex:none}
 .pill.r0{background:var(--r0-bg);color:var(--r0-ink);border-color:color-mix(in srgb,var(--r0) 34%,transparent)} .pill.r0 .bullet{background:var(--r0)}
 .pill.r1{background:var(--r1-bg);color:var(--r1-ink);border-color:color-mix(in srgb,var(--r1) 38%,transparent)} .pill.r1 .bullet{background:var(--r1)}
 .pill.r2{background:var(--r2-bg);color:var(--r2-ink);border-color:color-mix(in srgb,var(--r2) 38%,transparent)} .pill.r2 .bullet{background:var(--r2)}
 .pill.r3{background:var(--r3-bg);color:var(--r3-ink);border-color:color-mix(in srgb,var(--r3) 38%,transparent)} .pill.r3 .bullet{background:var(--r3)}
 .pill.neutral{background:var(--card-2);color:var(--ink-2);border-color:var(--line)}
 .pill.sm{font-size:11px;padding:2px 8px 2px 7px}
 
 /* Danh sách người bệnh */
 .plist{display:flex;flex-direction:column;gap:8px}
 .prow{display:flex;align-items:stretch;gap:0;background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;text-align:left;width:100%;transition:.12s}
 .prow:hover{border-color:var(--line-2);box-shadow:var(--shadow)}
 .prow .stripe{width:4px;flex:none;background:var(--line-2)}
 .prow.r0 .stripe{background:var(--r0)} .prow.r1 .stripe{background:var(--r1)} .prow.r2 .stripe{background:var(--r2)} .prow.r3 .stripe{background:var(--r3)}
 .prow .body{flex:1;min-width:0;padding:11px 13px;display:flex;flex-direction:column;gap:4px}
 .prow .n{font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
 .prow .m{font-size:12px;color:var(--ink-3);display:flex;gap:9px;flex-wrap:wrap;align-items:center}
 .prow .m .sep{opacity:.4}
 .prow .right{padding:11px 13px 11px 6px;display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:5px;flex:none}
 .prow .score{font-family:var(--mono);font-size:19px;font-weight:600;line-height:1}
 .prow .scorelab{font-size:10px;color:var(--ink-3);letter-spacing:.04em;text-transform:uppercase}
 
 /* Chuỗi quan tâm & Giao ban */
 .flag{border:1px solid var(--line);border-left:4px solid var(--r2);border-radius:var(--r-md);background:var(--card);overflow:hidden}
 .flag.done{border-left-color:var(--r0);opacity:.94}
 .flag .fh{padding:12px 13px;display:flex;flex-direction:column;gap:6px}
 .flag .ftop{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
 .flag .fname{font-weight:600;font-size:14.5px}
 .flag .ftext{font-size:14px;color:var(--ink);line-height:1.45}
 .chain{border-top:1px solid var(--line);background:var(--card-2);padding:10px 13px;display:flex;flex-direction:column;gap:0}
 .step{display:flex;gap:10px;position:relative;padding-bottom:12px}
 .step:last-child{padding-bottom:0}
 .step .col{display:flex;flex-direction:column;align-items:center;flex:none;width:18px}
 .step .dot{width:11px;height:11px;border-radius:50%;background:var(--accent);margin-top:4px;flex:none;border:2px solid var(--card-2);box-shadow:0 0 0 1.5px var(--accent)}
 .step .line{flex:1;width:1.5px;background:var(--line-2);margin:3px 0 -3px}
 .step:last-child .line{display:none}
 .step .txt{flex:1;min-width:0;font-size:13px;line-height:1.45;padding-bottom:2px}
 .step .who{font-size:11.5px;color:var(--ink-3);font-family:var(--mono);display:block;margin-top:2px}
 
 /* Timeline & Bảng */
 .tl{display:flex;flex-direction:column}
 .tlrow{display:flex;gap:11px;padding-bottom:14px;position:relative}
 .tlrow .tcol{width:34px;flex:none;display:flex;flex-direction:column;align-items:center}
 .tlrow .tscore{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-family:var(--mono);font-weight:600;font-size:14px;flex:none;border:1.5px solid}
 .tlrow.r0 .tscore{background:var(--r0-bg);color:var(--r0-ink);border-color:color-mix(in srgb,var(--r0) 40%,transparent)}
 .tlrow.r1 .tscore{background:var(--r1-bg);color:var(--r1-ink);border-color:color-mix(in srgb,var(--r1) 45%,transparent)}
 .tlrow.r2 .tscore{background:var(--r2-bg);color:var(--r2-ink);border-color:color-mix(in srgb,var(--r2) 45%,transparent)}
 .tlrow.r3 .tscore{background:var(--r3-bg);color:var(--r3-ink);border-color:color-mix(in srgb,var(--r3) 45%,transparent)}
 .tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-md);background:var(--card)}
 table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:560px}
 th{text-align:left;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--card-2)}
 td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
 
 /* Modal & Hộp thoại */
 .modal{position:fixed;inset:0;z-index:300;display:flex;align-items:flex-end;justify-content:center;background:rgba(10,20,22,.5);padding:0;backdrop-filter:blur(2px)}
 .sheet{background:var(--card);width:100%;max-width:560px;border-radius:20px 20px 0 0;max-height:92vh;display:flex;flex-direction:column;box-shadow:var(--shadow-lg);padding-bottom:env(safe-area-inset-bottom,0px)}
 .sheet .sh{padding:16px 18px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
 .sheet .sh h3{font-size:16px;flex:1}
 .sheet .sb{padding:16px 18px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:14px}
 .sheet .sf{padding:12px 18px 16px;border-top:1px solid var(--line);display:flex;gap:9px}
 .sheet .sf .btn{flex:1}
 @media(min-width:640px){.modal{align-items:center;padding:20px}.sheet{border-radius:20px}}
 
 /* Giao diện desktop rail */
 @media(min-width:900px){
   .tabbar{display:none}
   .rail{display:flex;flex-direction:column;width:232px;flex:none;border-right:1px solid var(--line);background:var(--card);position:sticky;top:0;height:100vh;padding:16px 12px;gap:3px;overflow-y:auto}
   .rail .rbrand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
   .rail .rbrand .glyph{width:34px;height:34px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
   .rail .rbrand .t{font-size:13.5px;font-weight:600;line-height:1.25}
   .rail .rbrand .t span{display:block;font-size:11px;color:var(--ink-3);font-weight:400}
   .rail button.nav{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:10px;border:0;background:none;color:var(--ink-2);font-size:14px;font-weight:500;text-align:left;position:relative}
   .rail button.nav:hover{background:var(--card-2);color:var(--ink)}
   .rail button.nav[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
   .rail button.nav svg{width:19px;height:19px;flex:none}
   .rail button.nav .dot{margin-left:auto;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;font-family:var(--mono)}
   .rail .rfoot{margin-top:auto;padding-top:14px;border-top:1px solid var(--line);font-size:12px;color:var(--ink-3)}
   .content{padding:22px 26px 40px}
   .topbar{padding:12px 26px}
 }
 </style>

<body>
 <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
 <symbol id="i-shield" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/><path d="M9 12.5 11 14.5 15.5 10"/></symbol>
 <symbol id="i-home" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.8V20h14V9.8"/><path d="M9.5 20v-6h5v6"/></symbol>

 <symbol id="i-user" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/></symbol>

 <symbol id="i-cog" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 14.6a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1v.2a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-2.8-1.1l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0-1.1-2.7h-.2a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.1-2.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3h.1A1.6 1.6 0 0 0 10 3.3v-.2a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 2.7 1.1l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0 1.1 2.7h.2a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.3.8Z"/></symbol>
 <symbol id="i-clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5.4l3.4 2"/></symbol>
 <symbol id="i-rotate" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 3.5V8h-4.5"/></symbol>
 <symbol id="i-handover" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="2.2"/><path d="M9 3h6v3H9z"/><path d="M9 11h6M9 15h4"/></symbol>
 <symbol id="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M19.1 4.9l-1.8 1.8M6.7 17.3l-1.8 1.8"/></symbol>
 </defs></svg>
 <div id="app"></div>
 <div class="toasts" id="toasts" aria-live="polite"></div>
 <div id="modalhost"></div>
 <script>
 "use strict";
 const PREVIEW = false;
 const APP_VER = "1.6.2";
 const LS_KEY  = "ltd_db_v1";
 const LS_CFG  = "ltd_cfg_v1";
 const $  = (s, r) => (r || document).querySelector(s);
 const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
 const uid = p => (p || "") + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
 const clone = o => JSON.parse(JSON.stringify(o));
 const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
 function pad(n) { return String(n).padStart(2, "0"); }
 function dOf(v) { return v instanceof Date ? v : new Date(v); }
 function fmtDate(v) { if (!v) return ""; const d = dOf(v); return `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()}`; }
 function fmtTime(v) { if (!v) return ""; const d = dOf(v); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; }
 function fmtDT(v) { if (!v) return ""; return `${fmtTime(v)} - ${fmtDate(v)}`; }
 function ageFrom(dob) {
   if (!dob) return null;
   const d = dOf(dob), n = new Date();
   let a = n.getFullYear() - d.getFullYear();
   const m = n.getMonth() - d.getMonth();
   if (m < 0 || (m === 0 && n.getDate() < d.getDate())) a--;
   return a;
 }
 function isoDay(v) { const d = dOf(v); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
 function daysBetween(a, b) { return Math.max(0, Math.round((dOf(b) - dOf(a)) / 86400000)); }
 function noAccent(s) { return String(s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase(); }
 
 // Hệ thống khởi tạo dữ liệu mẫu mặc định nếu chưa có cơ sở dữ liệu
 const CFG = {
   read() { try { return JSON.parse(localStorage.getItem(LS_CFG) || "{}"); } catch (e) { return {}; } },
   write(o) { try { localStorage.setItem(LS_CFG, JSON.stringify(o)); } catch (e) {} }
 };
 
 function emptyDB() {
   return {
     meta: { ver: APP_VER, rev: 0, salt: "khoa-hstc", epoch: uid("ep") },
     settings: {
       wardName: "Khoa Hồi Sức Tích Cực",
       hospital: "Bệnh Viện Đại Học Y Dược TP.HCM",
       thresholds: [10, 15, 20],
       reassessHours: [48, 24, 12, 8],
       turnEveryHours: 3,
       turnEveryHoursHigh: 2,
       turnHighFrom: 3,
       idleMinutes: 20,
       photosEnabled: true
     },
     users: [
       { id: "u1", name: "ThS.BS Điều dưỡng Châu", username: "ddt.chau", role: "ddt", pw: "8c6976e5b5410415bde908bd4dee15dfb167a9c873fc4bb8a81f6f2ab448a918", active: true },
       { id: "u2", name: "ĐD. Nguyễn Văn An", username: "dd.an", role: "dd", pw: "8c6976e5b5410415bde908bd4dee15dfb167a9c873fc4bb8a81f6f2ab448a918", active: true }
     ],
     patients: [], episodes: [], assessments: [], flags: [], audit: [], turns: [], lesionStates: [], lesionLogs: [], bundleLogs: [], skinChecks: [], handovers: [], handoverNotes: []
   };
 }
 
 const DB = {
   data: emptyDB(),
   mode: "local",
   url: "",
   online: true,
   syncing: false,
   loadLocal() {
     try {
       const raw = localStorage.getItem(LS_KEY);
       if (raw) { this.data = Object.assign(emptyDB(), JSON.parse(raw)); }
       else { this.data = emptyDB(); this.saveLocal(); }
     } catch (e) { this.data = emptyDB(); }
   },
   saveLocal() { try { localStorage.setItem(LS_KEY, JSON.stringify(this.data)); } catch (e) {} },
   save() { this.data.meta.rev = (this.data.meta.rev || 0) + 1; this.saveLocal(); render(); },
   user(id) { return this.data.users.find(u => u.id === id); },
   patient(id) { return this.data.patients.find(p => p.id === id); },
   episode(id) { return this.data.episodes.find(e => e.id === id); },
   activeEpisode(pid) { return this.data.episodes.filter(e => e.patientId === pid && !e.dischargedAt)[0] || null; },
   admittedPatients() { return this.data.episodes.filter(e => !e.dischargedAt).map(e => ({ ep: e, p: this.patient(e.patientId) })).filter(x => x.p); },
   lastAssessment(epId) { return this.data.assessments.filter(a => a.episodeId === epId).sort((a, b) => b.at.localeCompare(a.at))[0] || null; }
 };
 
 const Session = {
   user: null,
   login(u) { this.user = u; render(); },
   logout() { this.user = null; render(); },
   isHead() { return this.user && (this.user.role === "ddt" || this.user.role === "admin"); },
   roleName() { return this.user?.role === "ddt" ? "Điều dưỡng trưởng" : "Điều dưỡng"; }
 };
 
 const Nav = {
   stack: [{ name: "home" }],
   get cur() { return this.stack[this.stack.length - 1]; },
   go(name, params) { this.stack.push({ name, params: params || {} }); render(); window.scrollTo(0, 0); },
   tab(name) { this.stack = [{ name, params: {} }]; render(); window.scrollTo(0, 0); },
   back() { if (this.stack.length > 1) { this.stack.pop(); render(); window.scrollTo(0, 0); } }
 };
 
 function render() {
   const app = $("#app"); if (!app) return;
   if (!Session.user) {
     app.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100vh;background:var(--bg)"><div class="card" style="width:100%;max-width:380px">
       <h2>Đăng nhập hệ thống</h2>
       <p style="font-size:13px;color:var(--ink-3);margin-bottom:12px">Khoa Hồi Sức Tích Cực - BV Đại học Y Dược TP.HCM</p>
       <form id="lform">
         <div class="field"><label>Tên đăng nhập</label><input id="luser" type="text" value="ddt.chau"></div>
         <div class="field"><label>Mật khẩu</label><input id="lpw" type="password" value="123456"></div>
         <button class="btn pri block" type="submit" style="margin-top:12px">Đăng nhập</button>
       </form>
     </div></div>`;
     $("#lform").onsubmit = e => {
       e.preventDefault();
       const u = DB.data.users.find(x => x.username === $("#luser").value);
       if (u) Session.login(u);
       else alert("Sai tài khoản! (Mặc định: ddt.chau / 123456)");
     };
     return;
   }
   
   const v = Nav.cur;
   const contentHtml = v.name === "home" ? viewHome() : v.name === "patients" ? viewPatients() : `<div class="card"><h2>Tính năng đang phát triển</h2><button class="btn" onclick="Nav.tab('home')">Về trang chủ</button></div>`;
   
   app.innerHTML = `<div class="shell">
     <nav class="rail" aria-label="Điều hướng">
       <div class="rbrand"><span class="glyph"><svg><use href="#i-shield"/></svg></span>
         <span class="t">Loét Tì Đè <span>Khoa HSTC</span></span></div>
       <button class="nav" data-nav="home"><svg><use href="#i-home"/></svg>Trang chủ</button>
       <button class="nav" data-nav="patients"><svg><use href="#i-users"/></svg>Người bệnh</button>
       <div class="rfoot">
         <div style="font-weight:600;color:var(--ink-2);font-size:12.5px">${esc(Session.user.name)}</div>
         <div>${esc(Session.roleName())}</div>
         <button class="btn sm" style="margin-top:8px" onclick="Session.logout()">Đăng xuất</button>
       </div>
     </nav>
     <div class="main">
       <header class="topbar">
         <h1>Hệ thống Quản lý & Phòng ngừa Loét Tì Đè</h1>
       </header>
       <main class="content"><div class="page">${contentHtml}</div></main>
     </div>
   </div>`;
   $$("[data-nav]").forEach(b => b.onclick = () => Nav.tab(b.dataset.nav));
 }
 
 function viewHome() {
   const adm = DB.admittedPatients();
   return `<section class="card" style="background:linear-gradient(135deg,var(--accent-soft),var(--card))">
     <h2>Xin chào, ${esc(Session.user.name)}</h2>
     <p style="font-size:13.5px;margin-top:4px">Hệ thống hỗ trợ đánh giá Waterlow, theo dõi lật trở và quản lý tổn thương da Khoa Hồi Sức Tích Cực.</p>
   </section>
   <section class="tiles">
     <div class="tile tap" onclick="Nav.tab('patients')"><span class="lab">Đang điều trị</span><span class="val mono">${adm.length}</span><span class="note">Xem danh sách người bệnh</span></div>
   </section>`;
 }
 
 function viewPatients() {
   const adm = DB.admittedPatients();
   return `<div class="card"><div class="card-h"><h2>Danh sách người bệnh</h2><button class="btn pri sm" onclick="promptAddPatient()">Thêm người bệnh</button></div>
   <div class="tablewrap"><table><thead><tr><th>Họ tên</th><th>Mã NV</th><th>Giường</th><th>Chẩn đoán</th></tr></thead><tbody>
   ${adm.map(({p, ep}) => `<tr><td><b>${esc(p.name)}</b></td><td class="mono">${esc(p.mrn)}</td><td>${esc(ep.bed)}</td><td>${esc(ep.diagnosis)}</td></tr>`).join("")}
   </tbody></table></div></div>`;
 }
 
 function promptAddPatient() {
   const name = prompt("Nhập họ tên người bệnh:");
   if (!name) return;
   const mrn = prompt("Nhập mã y tế (MRN):", "26-" + Math.floor(Math.random()*90000+10000));
   const bed = prompt("Nhập số giường:", "HS-01");
   const p = { id: uid("p"), name, mrn, dob: "1990-01-01", sex: "nam" };
   const ep = { id: uid("e"), patientId: p.id, admittedAt: new Date().toISOString(), bed, diagnosis: "Viêm phổi thở máy" };
   DB.data.patients.push(p);
   DB.data.episodes.push(ep);
   DB.save();
   render();
 }
 
 DB.loadLocal();
 render();
 </script>
</body>
