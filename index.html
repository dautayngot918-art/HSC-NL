<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Theo Dõi Loét Tì Đè - ICU BV Bệnh Nhiệt Đới</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #050808;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .custom-scroll::-webkit-scrollbar { display: none; }
    .custom-scroll { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="flex justify-center min-h-screen">
  <div id="app" class="w-full max-w-md bg-[#0d1415] min-h-screen pb-24 relative shadow-2xl flex flex-col">
    
    <!-- Top Header -->
    <header class="px-4 pt-4 pb-2.5 flex justify-between items-center bg-[#0d1415] sticky top-0 z-30 border-b border-[#1c292b]">
      <div>
        <h1 id="page-title" class="text-lg font-bold text-white tracking-tight">Tổng quan</h1>
        <p id="page-subtitle" class="text-[11px] text-slate-400">Bệnh viện Bệnh Nhiệt đới</p>
      </div>
      <button class="p-2 rounded-xl bg-[#172223] text-slate-300 border border-[#233133]">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
        </svg>
      </button>
    </header>

    <!-- Main Content Area -->
    <main id="main-content" class="flex-1 px-4 py-3"></main>

    <!-- Bottom Navigation Bar -->
    <nav class="fixed bottom-0 max-w-md w-full bg-[#0d1415]/95 backdrop-blur-md border-t border-[#1c292b] px-2 py-2 flex justify-around items-center z-40">
      <button onclick="changeTab('home')" id="nav-home" class="flex flex-col items-center gap-1 text-teal-400 font-bold relative">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
        <span class="text-[10px]">Trang chủ</span>
      </button>

      <button onclick="changeTab('patients')" id="nav-patients" class="flex flex-col items-center gap-1 text-slate-400">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
        <span class="text-[10px]">Người bệnh</span>
      </button>

      <button onclick="changeTab('tasks')" id="nav-tasks" class="flex flex-col items-center gap-1 text-slate-400 relative">
        <div class="relative">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 21v-4m0 0V5a2 2 0 012-2h6.5l1 1H21l-3 6 3 6h-8.5l-1-1H5a2 2 0 00-2 2zm9-13.5V9"/></svg>
          <span id="nav-task-badge" class="absolute -top-1 -right-2 bg-rose-500 text-white text-[9px] font-bold w-4 h-4 rounded-full flex items-center justify-center border border-[#0d1415]">2</span>
        </div>
        <span class="text-[10px]">Cần lưu ý</span>
      </button>

      <button onclick="changeTab('handover')" id="nav-handover" class="flex flex-col items-center gap-1 text-slate-400">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
        <span class="text-[10px]">Giao ban</span>
      </button>

      <button onclick="changeTab('account')" id="nav-account" class="flex flex-col items-center gap-1 text-slate-400">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
        <span class="text-[10px]">Tài khoản</span>
      </button>
    </nav>

    <!-- Modal Nhận Bệnh Mới Chuẩn Hình Ảnh -->
    <div id="new-patient-modal" class="hidden fixed inset-0 bg-black/85 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center">
      <div class="w-full max-w-md bg-[#131d1e] border border-[#27393b] rounded-t-3xl sm:rounded-3xl max-h-[92vh] flex flex-col overflow-hidden shadow-2xl p-5 space-y-3.5 text-xs animate-in slide-in-from-bottom duration-200">
        
        <!-- Header Modal -->
        <div class="flex justify-between items-center pb-1">
          <h3 class="text-base font-bold text-white tracking-tight">Hồ sơ người bệnh mới</h3>
          <button onclick="closeNewPatientModal()" class="text-slate-400 hover:text-white p-1 rounded-lg">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
          </button>
        </div>

        <!-- Banner cảnh báo thông tin -->
        <div class="bg-[#122223] border border-[#1b3e3e] rounded-xl p-3 text-xs text-slate-300 flex items-start gap-2.5 leading-relaxed">
          <span class="text-teal-400 mt-0.5 text-sm">ℹ</span>
          <span>Nếu người bệnh đã từng nằm khoa, hãy tìm lại hồ sơ cũ bằng tên và ngày sinh thay vì tạo mới.</span>
        </div>

        <!-- Form nhập liệu -->
        <div class="space-y-3 pt-1">
          <div>
            <label class="text-xs text-slate-300 mb-1.5 block font-medium">Họ và tên</label>
            <input id="input-new-name" type="text" placeholder="Nguyễn Văn A" class="w-full bg-[#101718] border border-[#2a3c3e] rounded-xl px-3.5 py-2.5 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-teal-400" />
          </div>

          <div class="grid grid-cols-2 gap-2.5">
            <div>
              <label class="text-xs text-slate-300 mb-1.5 block font-medium">Mã hồ sơ bệnh viện</label>
              <input id="input-new-code" type="text" placeholder="vd: 26-045678" class="w-full bg-[#101718] border border-[#2a3c3e] rounded-xl px-3.5 py-2.5 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-teal-400" />
              <span class="text-[10px] text-slate-500 block mt-1">Đây là mã định danh chính, không trùng lặp.</span>
            </div>
            <div>
              <label class="text-xs text-slate-300 mb-1.5 block font-medium">Ngày sinh</label>
              <input id="input-new-dob" type="date" class="w-full bg-[#101718] border border-[#2a3c3e] rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-teal-400" />
            </div>
          </div>

          <div class="grid grid-cols-2 gap-2.5">
            <div>
              <label class="text-xs text-slate-300 mb-1.5 block font-medium">Giới tính</label>
              <select id="input-new-gender" class="w-full bg-[#101718] border border-[#2a3c3e] rounded-xl px-3 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-teal-400">
                <option value="Nam">Nam</option>
                <option value="Nữ">Nữ</option>
              </select>
            </div>
            <div>
              <label class="text-xs text-slate-300 mb-1.5 block font-medium">Giường</label>
              <input id="input-new-bed" type="text" placeholder="vd: HS-07" class="w-full bg-[#101718] border border-[#2a3c3e] rounded-xl px-3.5 py-2.5 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-teal-400" />
            </div>
          </div>

          <div>
            <label class="text-xs text-slate-300 mb-1.5 block font-medium">Chẩn đoán chính</label>
            <input id="input-new-diagnosis" type="text" placeholder="vd: Viêm phổi nặng, sốc nhiễm khuẩn" class="w-full bg-[#101718] border border-[#2a3c3e] rounded-xl px-3.5 py-2.5 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-teal-400" />
          </div>
        </div>

        <!-- 2 Nút Huỷ & Tạo và nhập khoa -->
        <div class="flex gap-2.5 pt-3">
          <button onclick="closeNewPatientModal()" class="flex-1 py-3 bg-[#1c2a2c] hover:bg-[#25373a] text-slate-300 border border-[#2b3c3e] font-semibold rounded-xl text-xs transition">
            Huỷ
          </button>
          <button onclick="saveNewPatient()" class="flex-1 py-3 bg-teal-500 hover:bg-teal-400 text-slate-950 font-bold rounded-xl text-xs transition shadow-lg shadow-teal-900/40">
            Tạo và nhập khoa
          </button>
        </div>
      </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="hidden fixed top-5 left-1/2 -translate-x-1/2 z-50 bg-teal-500 text-slate-950 px-4 py-2 rounded-full font-bold text-xs shadow-2xl transition"></div>
  </div>

  <script>
    // Database người bệnh
    let patients = [
      { id: "HS-08", code: "26-040239", name: "Nguyễn Thị Dung", bed: "HS-08", age: 49, waterlow: 23, status: "treating", riskLevel: "Nguy cơ rất cao", daysOverdueTurn: "3 ngày 15 giờ", turnTarget: 2, overdueAssessment: "Quá hạn 3 ngày 15 giờ", notes: "", noteDetail: "", days: 9, turns24h: 0 },
      { id: "HS-11", code: "26-040242", name: "Đỗ Ngọc Hoa", bed: "HS-11", age: 71, waterlow: 31, status: "treating", riskLevel: "Nguy cơ rất cao", daysOverdueTurn: "3 ngày 14 giờ", turnTarget: 2, overdueAssessment: "Quá hạn 3 ngày 14 giờ", notes: "", noteDetail: "", days: 13, turns24h: 0 },
      { id: "HS-07", code: "26-040238", name: "Phan Hữu Hùng", bed: "HS-07", age: 78, waterlow: 25, status: "treating", riskLevel: "Nguy cơ rất cao", daysOverdueTurn: "3 ngày 13 giờ", turnTarget: 2, overdueAssessment: "Quá hạn 3 ngày 13 giờ", notes: "", noteDetail: "", days: 11, turns24h: 0 },
      { id: "HS-10", code: "26-040241", name: "Nguyễn Thanh Khoa", bed: "HS-10", age: 42, waterlow: 29, status: "treating", riskLevel: "Nguy cơ rất cao", daysOverdueTurn: "3 ngày 12 giờ", turnTarget: 2, overdueAssessment: "Quá hạn 3 ngày 12 giờ", notes: "", noteDetail: "", days: 16, turns24h: 0 },
      { id: "HS-03", code: "26-040234", name: "Phạm Thu Linh", bed: "HS-03", age: 49, waterlow: 23, status: "treating", riskLevel: "Nguy cơ rất cao", daysOverdueTurn: "3 ngày 13 giờ", turnTarget: 2, overdueAssessment: "Quá hạn 3 ngày 13 giờ", notes: "", noteDetail: "", days: 17, turns24h: 0 },
      { id: "HS-04", code: "26-040235", name: "Phạm Hữu Hùng", bed: "HS-04", age: 65, waterlow: 19, status: "treating", riskLevel: "Nguy cơ cao", daysOverdueTurn: "2 ngày 13 giờ", turnTarget: 2, overdueAssessment: "Quá hạn đánh giá 4 ngày 13 giờ", notes: "1 lưu ý chưa tiếp nhận", noteDetail: "Kiểm tra đỏ vùng cùng cụt", days: 8, turns24h: 0 },
      { id: "HS-02", code: "26-040233", name: "Phan Đức Thắng", bed: "HS-02", age: 60, waterlow: 20, status: "treating", riskLevel: "Nguy cơ rất cao", daysOverdueTurn: "2 ngày 13 giờ", turnTarget: 2, overdueAssessment: "Quá hạn đánh giá 2 ngày 5 giờ", notes: "1 lưu ý chưa ghi kết quả", noteDetail: "Dán băng gạc hydrocolloid", days: 10, turns24h: 0 },
      { id: "HS-09", code: "26-040240", name: "Nguyễn Minh Nam", bed: "HS-09", age: 55, waterlow: null, status: "treating", riskLevel: "Chưa đánh giá", daysOverdueTurn: "2 ngày 13 giờ", turnTarget: 3, overdueAssessment: "Chưa đánh giá lần đầu", notes: "", noteDetail: "", days: 3, turns24h: 0 },
      { id: "HS-05", code: "26-040236", name: "Dương Công Cường", bed: "HS-05", age: 58, waterlow: 19, status: "treating", riskLevel: "Nguy cơ cao", daysOverdueTurn: "2 ngày 13 giờ", turnTarget: 2, overdueAssessment: "Quá hạn 2 ngày 13 giờ", notes: "", noteDetail: "", days: 12, turns24h: 0 },
      { id: "HS-01", code: "26-040232", name: "Lê Tấn Khoa", bed: "HS-01", age: 63, waterlow: 19, status: "treating", riskLevel: "Nguy cơ cao", daysOverdueTurn: "4 ngày 20 giờ", turnTarget: 2, overdueAssessment: "Quá hạn 4 ngày 20 giờ", notes: "", noteDetail: "", days: 14, turns24h: 0 },
      { id: "HS-12", code: "26-040243", name: "Ngô Thanh Chi", bed: "HS-12", age: 52, waterlow: 14, status: "treating", riskLevel: "Có nguy cơ", daysOverdueTurn: "3 ngày 20 giờ", turnTarget: 3, overdueAssessment: "Quá hạn 3 ngày 20 giờ", notes: "", noteDetail: "", days: 10, turns24h: 0 }
    ];

    let currentTab = 'home'; // Mặc định mở Trang chủ
    let patientFilterMode = 'treating'; // treating | discharged | all
    let patientViewMode = 'card'; // card | table
    let patientSearch = '';
    let patientSort = 'Ưu tiên chăm sóc';
    let patientTime = 'Mọi thời điểm';

    // Cần lưu ý filter
    let taskFilter = 'all'; // all | turn | assess | note
    let taskSearch = '';
    let taskSort = 'Ưu tiên chăm sóc';
    let taskTime = 'Mọi thời điểm';

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.innerText = msg;
      toast.classList.remove('hidden');
      setTimeout(() => { toast.classList.add('hidden'); }, 2400);
    }

    function openNewPatientModal() {
      document.getElementById('new-patient-modal').classList.remove('hidden');
    }

    function closeNewPatientModal() {
      document.getElementById('new-patient-modal').classList.add('hidden');
    }

    // Lưu người bệnh mới nhập vào danh sách điều trị
    function saveNewPatient() {
      const name = document.getElementById('input-new-name').value.trim();
      const code = document.getElementById('input-new-code').value.trim();
      const bed = document.getElementById('input-new-bed').value.trim() || 'HS-Mới';
      const diagnosis = document.getElementById('input-new-diagnosis').value.trim();

      if (!name) {
        alert('Vui lòng nhập Họ và tên người bệnh!');
        return;
      }

      const newId = bed;
      const newPatient = {
        id: newId,
        code: code || `26-${Math.floor(100000 + Math.random() * 900000)}`,
        name: name,
        bed: bed,
        age: 50,
        waterlow: null,
        status: "treating",
        riskLevel: "Chưa đánh giá",
        daysOverdueTurn: "Vừa nhận bệnh",
        turnTarget: 2,
        overdueAssessment: "Chưa đánh giá lần đầu",
        notes: diagnosis ? `Chẩn đoán: ${diagnosis}` : "Chưa có lưu ý",
        noteDetail: diagnosis,
        days: 1,
        turns24h: 0
      };

      // Đưa bệnh nhân mới vào đầu danh sách
      patients.unshift(newPatient);

      // Đóng modal và reset input
      closeNewPatientModal();
      document.getElementById('input-new-name').value = '';
      document.getElementById('input-new-code').value = '';
      document.getElementById('input-new-bed').value = '';
      document.getElementById('input-new-diagnosis').value = '';

      showToast(`Đã nhận bệnh ${name} vào giường ${bed}!`);

      // Tự động chuyển ngay sang tab người bệnh để xem hồ sơ vừa tạo
      changeTab('patients');
    }

    // Hàm chuyển đổi tab linh hoạt
    function changeTab(tab, customFilter = null) {
      currentTab = tab;

      if (tab === 'tasks' && customFilter) {
        taskFilter = customFilter;
      }
      if (tab === 'patients' && customFilter) {
        patientFilterMode = customFilter;
      }

      // Cập nhật giao diện tab bar
      ['home', 'patients', 'tasks', 'handover', 'account'].forEach(t => {
        const btn = document.getElementById(`nav-${t}`);
        if (t === tab) {
          btn.className = "flex flex-col items-center gap-1 text-teal-400 font-bold relative";
        } else {
          btn.className = "flex flex-col items-center gap-1 text-slate-400";
        }
      });

      const title = document.getElementById('page-title');
      const sub = document.getElementById('page-subtitle');
      if (tab === 'home') {
        title.innerText = 'Tổng quan';
        sub.innerText = 'Bệnh viện Bệnh Nhiệt đới';
      } else if (tab === 'patients') {
        title.innerText = 'Người bệnh';
        const treatingCount = patients.filter(p => p.status === 'treating').length;
        sub.innerText = `${treatingCount} đang điều trị`;
      } else if (tab === 'tasks') {
        title.innerText = 'Cần lưu ý';
        sub.innerText = 'Khoa Hồi sức tích cực';
      } else if (tab === 'handover') {
        title.innerText = 'Giao ban ca';
        sub.innerText = 'Khoa Hồi sức tích cực';
      } else {
        title.innerText = 'Tài khoản';
        sub.innerText = 'Bệnh viện Bệnh Nhiệt đới';
      }

      render();
    }

    function renderRiskBadge(risk) {
      if (risk === "Nguy cơ rất cao") {
        return `<span class="text-[11px] px-2.5 py-0.5 rounded-full bg-[#3c1820] text-[#f87171] font-semibold border border-[#dc2626]/40 flex items-center gap-1.5"><span class="w-1.5 h-1.5 rounded-full bg-red-500"></span>Nguy cơ rất cao</span>`;
      }
      if (risk === "Nguy cơ cao") {
        return `<span class="text-[11px] px-2.5 py-0.5 rounded-full bg-[#352516] text-[#fb923c] font-semibold border border-[#ea580c]/40 flex items-center gap-1.5"><span class="w-1.5 h-1.5 rounded-full bg-orange-500"></span>Nguy cơ cao</span>`;
      }
      if (risk === "Có nguy cơ") {
        return `<span class="text-[11px] px-2.5 py-0.5 rounded-full bg-[#302b16] text-[#facc15] font-semibold border border-[#ca8a04]/40 flex items-center gap-1.5"><span class="w-1.5 h-1.5 rounded-full bg-yellow-500"></span>Có nguy cơ</span>`;
      }
      return `<span class="text-[11px] px-2.5 py-0.5 rounded-full bg-slate-800 text-slate-300 font-semibold border border-slate-700">Chưa đánh giá</span>`;
    }

    // Các hàm thao tác
    function actionTurn(id) {
      const p = patients.find(x => x.id === id);
      if (p) {
        p.daysOverdueTurn = "Vừa xoay";
        p.turns24h += 1;
        showToast(`Đã xoay trở ${p.bed} - ${p.name}!`);
        render();
      }
    }

    function actionAssess(id) {
      const p = patients.find(x => x.id === id);
      if (p) {
        p.overdueAssessment = null;
        if (!p.waterlow) { p.waterlow = 22; p.riskLevel = "Nguy cơ rất cao"; }
        showToast(`Đã lưu đánh giá Waterlow ${p.bed}!`);
        render();
      }
    }

    function actionNote(id) {
      const p = patients.find(x => x.id === id);
      if (p) {
        p.notes = "";
        showToast(`Đã xử lý lưu ý cho ${p.name}!`);
        render();
      }
    }

    // ==========================================
    // 1. RENDER TRANG CHỦ (TỔNG QUAN)
    // ==========================================
    function renderHomeTab() {
      const treatingList = patients.filter(p => p.status === 'treating');
      const highRiskCount = treatingList.filter(p => p.riskLevel === 'Nguy cơ rất cao' || p.riskLevel === 'Nguy cơ cao').length;
      const needAssessCount = treatingList.filter(p => p.overdueAssessment).length;
      const needTurnCount = treatingList.filter(p => p.daysOverdueTurn !== 'Vừa xoay' && p.daysOverdueTurn !== 'Vừa nhận bệnh').length;
      const unhandledNotesCount = treatingList.filter(p => p.notes).length;

      return `
        <div class="space-y-4">
          <!-- Banner Khoa -->
          <div class="bg-[#141e1f] border border-[#223133] rounded-2xl p-4">
            <span class="text-[10px] font-semibold text-teal-400 uppercase tracking-wider block mb-0.5">Khoa Hồi Sức Tích Cực</span>
            <h2 class="text-lg font-bold text-white">Chào buổi sáng, An</h2>
            <p class="text-xs text-slate-400 mt-1">Điều dưỡng · phiên làm việc 26/09/2026</p>
          </div>

          <!-- Nút Nhận Bệnh Mới Nổi Bật Ngay Trang Chủ -->
          <button 
            onclick="openNewPatientModal()"
            class="w-full bg-[#162729] hover:bg-[#1e3335] border-2 border-teal-500/50 hover:border-teal-400 text-teal-300 font-bold py-3.5 px-4 rounded-2xl shadow-xl flex items-center justify-between transition group"
          >
            <div class="flex items-center gap-3">
              <div class="w-10 h-10 rounded-xl bg-teal-500 text-slate-950 flex items-center justify-center font-bold text-xl group-hover:scale-105 transition">
                +
              </div>
              <div class="text-left">
                <span class="text-sm font-bold text-white block">Nhận bệnh mới vào khoa</span>
                <span class="text-[11px] text-teal-400/80">Tạo hồ sơ người bệnh mới & nhập khoa ICU</span>
              </div>
            </div>
            <span class="text-teal-400 text-xs font-semibold">Tạo mới →</span>
          </button>

          <!-- 4 Ô Thống Kê - CLICK TRỰC TIẾP ĐỂ CHUYỂN TRANG -->
          <div class="grid grid-cols-2 gap-2.5">
            <!-- Ô 1: Link tới Người bệnh đang điều trị -->
            <div 
              onclick="changeTab('patients', 'treating')"
              class="bg-[#152122] hover:bg-[#1a2b2d] border border-[#223335] hover:border-teal-500/50 rounded-2xl p-3.5 cursor-pointer transition shadow-sm"
            >

            <!-- Ô 2: Link tới Danh sách đến hạn đánh giá -->
            <div 
              onclick="changeTab('tasks', 'assess')"

              <div class="flex justify-between items-start">
                <span class="text-xs text-slate-400 block mb-1">Đến hạn đánh giá</span>
                <span class="text-[10px] text-orange-400">Xem →</span>
              </div>
              <div class="text-2xl font-bold text-orange-400 leading-tight">${needAssessCount}</div>
              <span class="text-[11px] text-slate-400 mt-1 block">1 ca chưa đánh giá lần nào</span>
            </div>

            <!-- Ô 3: Link tới Danh sách đến lúc xoay trở -->
            <div 
              onclick="changeTab('tasks', 'turn')"
              class="bg-[#152122] hover:bg-[#1a2b2d] border border-[#223335] hover:border-orange-500/50 rounded-2xl p-3.5 cursor-pointer transition shadow-sm"
            >
              <div class="flex justify-between items-start">
                <span class="text-xs text-slate-400 block mb-1">Đã tới lúc xoay trở</span>
                <span class="text-[10px] text-orange-400">Xem →</span>
              </div>
              <div class="text-2xl font-bold text-orange-400 leading-tight">${needTurnCount}</div>
              <span class="text-[11px] text-slate-400 mt-1 block">quá khoảng cách mục tiêu khoa</span>
            </div>

            <!-- Ô 4: Link tới Cần lưu ý chưa xử lý -->
            <div 
              onclick="changeTab('tasks', 'note')"

            >
              <div class="flex justify-between items-start">
                <span class="text-xs text-slate-400 block mb-1">Cần lưu ý chưa xử lý</span>
                <span class="text-[10px] text-rose-400">Xem →</span>
              </div>
              <div class="text-2xl font-bold text-red-400 leading-tight">${unhandledNotesCount}</div>
              <span class="text-[11px] text-slate-400 mt-1 block">${unhandledNotesCount} mục chưa tiếp nhận</span>
            </div>

          <!-- Ghi Xoay Trở Cả Buồng -->
          <div class="space-y-2 pt-1">
            <div class="flex items-center gap-1.5">
              <span class="w-1 h-3.5 bg-teal-400 rounded-full"></span>
              <h3 class="text-sm font-semibold text-white">Xoay trở buồng bệnh</h3>
            </div>
            <p class="text-xs text-slate-400">${needTurnCount} người bệnh đã tới lúc xoay</p>
            <button 
              onclick="patients.forEach(p => { p.daysOverdueTurn = 'Vừa xoay'; p.turns24h += 1; }); showToast('Đã ghi xoay trở cho toàn bộ buồng bệnh!'); render();"
              class="w-full bg-[#f97316] hover:bg-[#ea580c] text-white font-bold py-3.5 rounded-2xl shadow-lg shadow-orange-950/40 text-sm flex items-center justify-center gap-2 transition"
            >
              <svg class="w-5 h-5 animate-spin-reverse" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
              Ghi xoay trở cả buồng (${treatingList.length} người bệnh)

          </div>
        </div>

    }

    // ==========================================
    // 2. RENDER TRANG CẦN LƯU Ý (VIỆC CẦN LÀM)
    // ==========================================
    function renderTasksTab() {
      let list = patients.filter(p => p.status === 'treating');

      // Tìm kiếm
      if (taskSearch.trim()) {
        const q = taskSearch.toLowerCase();
        list = list.filter(p => p.name.toLowerCase().includes(q) || p.bed.toLowerCase().includes(q) || p.code.toLowerCase().includes(q));
      }

      // Bộ lọc
      if (taskFilter === 'turn') {
        list = list.filter(p => p.daysOverdueTurn !== "Vừa xoay" && p.daysOverdueTurn !== "Vừa nhận bệnh");
      } else if (taskFilter === 'assess') {
        list = list.filter(p => p.overdueAssessment);
      } else if (taskFilter === 'note') {
        list = list.filter(p => p.notes);
      }

      // Sắp xếp
      if (taskSort === 'Tên A → Z') list.sort((a,b) => a.name.localeCompare(b.name, 'vi'));
      else if (taskSort === 'Theo giường') list.sort((a,b) => a.bed.localeCompare(b.bed));
      else if (taskSort === 'Điểm Waterlow cao nhất') list.sort((a,b) => (b.waterlow || 0) - (a.waterlow || 0));
      else list.sort((a,b) => (b.waterlow || 0) - (a.waterlow || 0));

      return `
        <div class="space-y-3">
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-1.5">
              <span class="w-1.5 h-4 bg-teal-400 rounded-full"></span>
              <h2 class="text-base font-bold text-white tracking-tight">Việc cần làm</h2>
            </div>
            <span class="text-xs text-rose-400 font-semibold bg-rose-950/40 border border-rose-800/40 px-2.5 py-0.5 rounded-full">
              ${patients.filter(p => p.overdueAssessment || p.notes).length} đang trễ
            </span>
          </div>

          <!-- Thanh tìm kiếm -->
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-500">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
            </span>
            <input
              type="text"
              value="${taskSearch}"
              placeholder="Tìm theo tên hoặc mã hồ sơ"
              oninput="taskSearch = this.value; renderTasksListOnly();"
              class="w-full bg-[#152122] border border-[#223335] rounded-xl pl-9 pr-3 py-2 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-teal-400"
            />
          </div>

          <!-- Bộ 4 nút lọc -->
          <div class="grid grid-cols-4 gap-1 bg-[#121c1d] p-1 rounded-xl border border-[#1f2d2f] text-[11px]">
            <button onclick="taskFilter='all'; render();" class="py-1.5 rounded-lg transition text-center ${taskFilter==='all'?'bg-teal-500 text-slate-950 font-bold':'text-slate-400'}">Tất cả</button>
            <button onclick="taskFilter='turn'; render();" class="py-1.5 rounded-lg transition text-center ${taskFilter==='turn'?'bg-teal-500 text-slate-950 font-bold':'text-slate-400'}">Xoay trở</button>
            <button onclick="taskFilter='assess'; render();" class="py-1.5 rounded-lg transition text-center ${taskFilter==='assess'?'bg-teal-500 text-slate-950 font-bold':'text-slate-400'}">Đánh giá</button>
            <button onclick="taskFilter='note'; render();" class="py-1.5 rounded-lg transition text-center ${taskFilter==='note'?'bg-teal-500 text-slate-950 font-bold':'text-slate-400'}">Lưu ý</button>
          </div>

          <!-- Thời gian & Sắp xếp -->
          <div class="grid grid-cols-2 gap-2 text-xs">
            <div>
              <span class="text-[11px] text-slate-400 mb-1 block">Thời gian</span>
              <select onchange="taskTime=this.value; render();" class="w-full bg-[#152122] border border-[#243436] rounded-xl px-2.5 py-2 text-slate-200 focus:outline-none">
                <option ${taskTime==='Mọi thời điểm'?'selected':''}>Mọi thời điểm</option>
                <option ${taskTime==='24 giờ qua'?'selected':''}>24 giờ qua</option>
                <option ${taskTime==='3 ngày gần nhất'?'selected':''}>3 ngày gần nhất</option>
                <option ${taskTime==='7 ngày gần nhất'?'selected':''}>7 ngày gần nhất</option>
              </select>
            </div>
            <div>
              <span class="text-[11px] text-slate-400 mb-1 block">Sắp xếp</span>
              <select onchange="taskSort=this.value; render();" class="w-full bg-[#152122] border border-[#243436] rounded-xl px-2.5 py-2 text-slate-200 focus:outline-none">
                <option ${taskSort==='Ưu tiên chăm sóc'?'selected':''}>Ưu tiên chăm sóc</option>
                <option ${taskSort==='Điểm Waterlow cao nhất'?'selected':''}>Điểm Waterlow cao nhất</option>
                <option ${taskSort==='Theo giường'?'selected':''}>Theo giường</option>
                <option ${taskSort==='Tên A → Z'?'selected':''}>Tên A → Z</option>
              </select>
            </div>
          </div>

          <!-- Danh sách thẻ -->
          <div id="tasks-list" class="space-y-3 pt-1">
            ${list.length === 0 ? `
              <div class="p-8 text-center text-xs text-slate-400 bg-[#141e1f] rounded-2xl border border-[#213032]">
                Không có người bệnh nào cần xử lý theo bộ lọc này.
              </div>
            ` : list.map(p => `
              <div class="bg-[#152122] border border-[#233335] rounded-2xl p-4 space-y-2.5 shadow-sm">
                <div class="flex items-center justify-between flex-wrap gap-2">
                  <div class="flex items-center gap-2">
                    <span class="text-[11px] font-semibold text-slate-300 bg-[#1c2a2c] px-2 py-0.5 rounded-md border border-[#2b3d40]">${p.bed}</span>
                    <h3 class="text-sm font-bold text-white">${p.name}</h3>
                  </div>
                  <div>${renderRiskBadge(p.riskLevel)}</div>
                </div>

                <div>
                  <span class="inline-block bg-[#1a2729] text-slate-300 text-[10px] font-medium px-2 py-0.5 rounded border border-[#25383a]">
                    Waterlow ${p.waterlow !== null ? p.waterlow : '--'}
                  </span>
                </div>

                <ul class="text-xs space-y-1 text-slate-300 pt-0.5">
                  ${p.notes ? `
                    <li class="flex items-start gap-1.5 text-[#fb923c]">
                      <span class="text-orange-400 font-bold">•</span>
                      <span>${p.notes} ${p.noteDetail ? `(${p.noteDetail})` : ''}</span>
                    </li>
                  ` : ''}

                  ${p.overdueAssessment ? `
                    <li class="flex items-start gap-1.5 text-[#f87171]">
                      <span class="text-red-400 font-bold">•</span>
                      <span>${p.overdueAssessment}</span>
                    </li>
                  ` : ''}

                  <li class="flex items-start gap-1.5 text-[#fb923c]">
                    <span class="text-orange-400 font-bold">•</span>
                    <span>${p.daysOverdueTurn === 'Vừa xoay' ? 'Đã xoay trở đúng hạn' : (p.daysOverdueTurn === 'Vừa nhận bệnh' ? 'Vừa nhập viện, chuẩn bị xoay trở' : `Đã ${p.daysOverdueTurn} chưa xoay — mục tiêu mỗi ${p.turnTarget} giờ`)}</span>
                  </li>
                </ul>

                <div class="grid grid-cols-3 gap-2 pt-1.5">
                  <button onclick="actionTurn('${p.id}')" class="bg-teal-500 hover:bg-teal-400 text-slate-950 font-bold py-2 rounded-xl text-xs text-center shadow-sm">
                    Ghi xoay trở
                  </button>
                  <button onclick="actionAssess('${p.id}')" class="bg-[#1f2d2f] hover:bg-[#283b3d] text-slate-200 border border-[#2d4042] font-semibold py-2 rounded-xl text-xs text-center">
                    Đánh giá
                  </button>
                  <button onclick="actionNote('${p.id}')" class="bg-[#1f2d2f] hover:bg-[#283b3d] text-slate-200 border border-[#2d4042] font-semibold py-2 rounded-xl text-xs text-center">
                    ${p.notes ? 'Xem lưu ý' : 'Mở hồ sơ'}
                  </button>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function renderTasksListOnly() {
      const container = document.getElementById('tasks-list');
      if (!container) return;
      let list = patients.filter(p => p.status === 'treating');
      if (taskSearch.trim()) {
        const q = taskSearch.toLowerCase();
        list = list.filter(p => p.name.toLowerCase().includes(q) || p.bed.toLowerCase().includes(q) || p.code.toLowerCase().includes(q));
      }
      container.innerHTML = list.map(p => `
        <div class="bg-[#152122] border border-[#233335] rounded-2xl p-4 space-y-2.5 shadow-sm">
          <div class="flex items-center justify-between flex-wrap gap-2">
            <div class="flex items-center gap-2">
              <span class="text-[11px] font-semibold text-slate-300 bg-[#1c2a2c] px-2 py-0.5 rounded-md border border-[#2b3d40]">${p.bed}</span>
              <h3 class="text-sm font-bold text-white">${p.name}</h3>
            </div>
            <div>${renderRiskBadge(p.riskLevel)}</div>
          </div>
          <div>
            <span class="inline-block bg-[#1a2729] text-slate-300 text-[10px] font-medium px-2 py-0.5 rounded border border-[#25383a]">Waterlow ${p.waterlow !== null ? p.waterlow : '--'}</span>
          </div>
          <ul class="text-xs space-y-1 text-slate-300 pt-0.5">
            ${p.notes ? `<li class="flex items-start gap-1.5 text-[#fb923c]"><span class="text-orange-400 font-bold">•</span><span>${p.notes}</span></li>` : ''}
            ${p.overdueAssessment ? `<li class="flex items-start gap-1.5 text-[#f87171]"><span class="text-red-400 font-bold">•</span><span>${p.overdueAssessment}</span></li>` : ''}
            <li class="flex items-start gap-1.5 text-[#fb923c]"><span class="text-orange-400 font-bold">•</span><span>${p.daysOverdueTurn}</span></li>
          </ul>
          <div class="grid grid-cols-3 gap-2 pt-1.5">
            <button onclick="actionTurn('${p.id}')" class="bg-teal-500 text-slate-950 font-bold py-2 rounded-xl text-xs">Ghi xoay trở</button>
            <button onclick="actionAssess('${p.id}')" class="bg-[#1f2d2f] text-slate-200 border border-[#2d4042] font-semibold py-2 rounded-xl text-xs">Đánh giá</button>
            <button onclick="actionNote('${p.id}')" class="bg-[#1f2d2f] text-slate-200 border border-[#2d4042] font-semibold py-2 rounded-xl text-xs">${p.notes ? 'Xem lưu ý' : 'Mở hồ sơ'}</button>
          </div>
        </div>
      `).join('');
    }

    // ==========================================
    // 3. RENDER TRANG NGƯỜI BỆNH
    // ==========================================
    function renderPatientsTab() {
      let list = [...patients];

      if (patientFilterMode === 'treating') {
        list = list.filter(p => p.status === 'treating');
      } else if (patientFilterMode === 'discharged') {
        list = list.filter(p => p.status === 'discharged');
      }

      if (patientSearch.trim()) {
        const q = patientSearch.toLowerCase();
        list = list.filter(p => p.name.toLowerCase().includes(q) || p.code.toLowerCase().includes(q) || p.bed.toLowerCase().includes(q));
      }

      if (patientSort === 'Tên A → Z') list.sort((a,b) => a.name.localeCompare(b.name, 'vi'));
      else if (patientSort === 'Theo giường') list.sort((a,b) => a.bed.localeCompare(b.bed));
      else if (patientSort === 'Điểm Waterlow cao nhất') list.sort((a,b) => (b.waterlow || 0) - (a.waterlow || 0));

      const treatingCount = patients.filter(p => p.status === 'treating').length;

      return `
        <div class="space-y-3">
          <!-- Tìm kiếm & Nút thêm hồ sơ mới -->
          <div class="flex gap-2">
            <div class="relative flex-1">
              <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-500">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
              </span>
              <input
                type="text"
                value="${patientSearch}"
                placeholder="Tìm theo tên hoặc mã hồ sơ"
                oninput="patientSearch = this.value; render();"
                class="w-full bg-[#152122] border border-[#223335] rounded-xl pl-9 pr-3 py-2 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-teal-400"
              />
            </div>
            <button 
              onclick="openNewPatientModal()"
              class="bg-teal-500 hover:bg-teal-400 text-slate-950 font-bold px-3 py-2 rounded-xl text-xs flex items-center gap-1 shrink-0"
            >
              + Hồ sơ mới
            </button>
          </div>

          <!-- 3 Nút lọc trạng thái hồ sơ -->
          <div class="grid grid-cols-3 gap-1.5 bg-[#121c1d] p-1 rounded-xl border border-[#1f2d2f]">
            <button
              onclick="patientFilterMode='treating'; render();"
              class="py-1.5 text-center rounded-lg text-xs font-semibold transition ${patientFilterMode === 'treating' ? 'bg-teal-500 text-slate-950 shadow' : 'text-slate-400'}"
            >
              Đang điều trị<br/><span class="text-[10px]">${treatingCount}</span>
            </button>
            <button
              onclick="patientFilterMode='discharged'; render();"
              class="py-1.5 text-center rounded-lg text-xs font-semibold transition ${patientFilterMode === 'discharged' ? 'bg-teal-500 text-slate-950 shadow' : 'text-slate-400'}"
            >
              Đã kết thúc<br/><span class="text-[10px]">132</span>
            </button>
            <button
              onclick="patientFilterMode='all'; render();"
              class="py-1.5 text-center rounded-lg text-xs font-semibold transition ${patientFilterMode === 'all' ? 'bg-teal-500 text-slate-950 shadow' : 'text-slate-400'}"
            >
              Tất cả<br/><span class="text-[10px]">${treatingCount + 132}</span>
            </button>
          </div>

          <!-- Lọc Thời gian & Sắp xếp -->
          <div class="grid grid-cols-2 gap-2 text-xs">
            <div>
              <span class="text-[11px] text-slate-400 mb-1 block">Thời gian</span>
              <select onchange="patientTime=this.value; render();" class="w-full bg-[#152122] border border-[#243436] rounded-xl px-2.5 py-2 text-slate-200 focus:outline-none">
                <option>Mọi thời điểm</option>
                <option>7 ngày gần nhất</option>
                <option>30 ngày gần nhất</option>
              </select>
            </div>
            <div>
              <span class="text-[11px] text-slate-400 mb-1 block">Sắp xếp</span>
              <select onchange="patientSort=this.value; render();" class="w-full bg-[#152122] border border-[#243436] rounded-xl px-2.5 py-2 text-slate-200 focus:outline-none">
                <option ${patientSort==='Ưu tiên chăm sóc'?'selected':''}>Ưu tiên chăm sóc</option>
                <option ${patientSort==='Điểm Waterlow cao nhất'?'selected':''}>Điểm Waterlow cao nhất</option>
                <option ${patientSort==='Theo giường'?'selected':''}>Theo giường</option>
                <option ${patientSort==='Tên A → Z'?'selected':''}>Tên A → Z</option>
              </select>
            </div>
          </div>

          <!-- Chuyển Đổi Thẻ / Bảng -->
          <div class="flex justify-end">
            <div class="bg-[#121c1d] border border-[#202f31] rounded-xl p-0.5 flex">
              <button onclick="patientViewMode='card'; render();" class="px-3 py-1 rounded-lg text-xs ${patientViewMode==='card'?'bg-teal-500 text-slate-950 font-bold':'text-slate-400'}">Thẻ</button>
              <button onclick="patientViewMode='table'; render();" class="px-3 py-1 rounded-lg text-xs ${patientViewMode==='table'?'bg-teal-500 text-slate-950 font-bold':'text-slate-400'}">Bảng</button>
            </div>
          </div>

          <!-- Dạng Thẻ -->
          ${patientViewMode === 'card' ? `
            <div class="space-y-2.5">
              ${list.map(p => `
                <div class="bg-[#162122] border border-[#233335] rounded-2xl p-3.5 flex justify-between items-center relative overflow-hidden shadow-sm">
                  <div class="absolute left-0 top-0 bottom-0 w-1 bg-rose-500"></div>
                  <div class="pl-1">
                    <h4 class="text-sm font-bold text-white">${p.name}</h4>
                    <div class="text-[11px] text-slate-400 flex items-center gap-2 mt-0.5">
                      <span>${p.code}</span> · <span>${p.age} tuổi</span> · <span class="text-teal-300 font-semibold">${p.bed}</span>
                    </div>
                    <div class="text-[11px] text-rose-400 font-medium mt-1">${p.daysOverdueTurn}</div>
                  </div>
                  <div class="text-right bg-[#1c2a2c] px-3 py-1.5 rounded-xl border border-[#2b3e40]">
                    <div class="text-xl font-bold text-slate-100 leading-tight">${p.waterlow ?? '--'}</div>
                    <span class="text-[9px] font-semibold text-slate-400 uppercase tracking-wider">WATERLOW</span>
                  </div>
                </div>
              `).join('')}
            </div>
          ` : `
            <div class="bg-[#141e1f] border border-[#223335] rounded-2xl overflow-x-auto shadow">
              <table class="w-full text-left text-xs text-slate-300">
                <thead class="bg-[#182526] text-[10px] text-slate-400 uppercase border-b border-[#233335]">
                  <tr>
                    <th class="py-2.5 px-3">Người bệnh</th>
                    <th class="py-2.5 px-2">Mã HS</th>
                    <th class="py-2.5 px-2">Giường</th>
                    <th class="py-2.5 px-2">Waterlow</th>
                    <th class="py-2.5 px-3">Mức độ</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-[#1e2c2e]">
                  ${list.map(p => `
                    <tr>
                      <td class="py-2.5 px-3 font-semibold text-white whitespace-nowrap">${p.name}</td>
                      <td class="py-2.5 px-2 text-slate-400 whitespace-nowrap">${p.code}</td>
                      <td class="py-2.5 px-2 text-teal-300 whitespace-nowrap">${p.bed}</td>
                      <td class="py-2.5 px-2 font-bold whitespace-nowrap">${p.waterlow ?? '--'}</td>
                      <td class="py-2.5 px-3 whitespace-nowrap">${renderRiskBadge(p.riskLevel)}</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          `}
        </div>
      `;
    }

    // ==========================================
    // 4. RENDER GIAO BAN
    // ==========================================
    function renderHandoverTab() {
      const treatingList = patients.filter(p => p.status === 'treating');
      const veryHighRisk = treatingList.filter(p => (p.waterlow || 0) >= 20).length;

      return `
        <div class="bg-[#152122] border border-[#223335] rounded-2xl p-4 space-y-3">
          <h3 class="text-sm font-bold text-white">Sổ giao ban ca trực ICU</h3>
          <p class="text-xs text-slate-400">Tổng hợp nguy cơ loét tì đè và bàn giao chăm sóc ca trực.</p>
          <div class="bg-[#11191a] border border-[#202e30] rounded-xl p-3 text-xs space-y-2 text-slate-300">
            <div class="flex justify-between"><span class="text-slate-400">Tổng số người bệnh:</span><span class="font-bold text-white">${treatingList.length}</span></div>
            <div class="flex justify-between"><span class="text-slate-400">Nguy cơ rất cao (Waterlow ≥ 20):</span><span class="font-bold text-red-400">${veryHighRisk}</span></div>
          </div>
          <textarea rows="3" placeholder="Nhập dặn dò ca sau về các ca bệnh nặng..." class="w-full bg-[#11191a] border border-[#25383a] rounded-xl p-3 text-xs text-slate-200 focus:outline-none"></textarea>
          <button onclick="showToast('Đã lưu và ký biên bản giao ban!');" class="w-full bg-teal-500 font-bold text-slate-950 py-2.5 rounded-xl text-xs">Ký xác nhận bàn giao ca</button>
        </div>
      `;
    }

    // ==========================================
    // 5. RENDER TÀI KHOẢN
    // ==========================================
    function renderAccountTab() {
      return `
        <div class="space-y-3">
          <div class="bg-[#152122] border border-[#223335] rounded-2xl p-4 flex items-center gap-3">
            <div class="w-12 h-12 rounded-xl bg-teal-500/20 text-teal-400 flex items-center justify-center font-bold text-lg">A</div>
            <div>
              <h3 class="text-base font-bold text-white">Trần Văn An</h3>
              <p class="text-xs text-slate-400">Điều dưỡng · dd.an</p>
            </div>
          </div>
          <div class="grid grid-cols-2 gap-2.5">
            <div class="bg-[#152122] border border-[#223335] rounded-2xl p-3.5">
              <span class="text-xs text-slate-400 block mb-1">Lượt đánh giá hôm nay</span>
              <span class="text-2xl font-bold text-white">0</span>
            </div>
            <div class="bg-[#152122] border border-[#223335] rounded-2xl p-3.5">
              <span class="text-xs text-slate-400 block mb-1">Tổng lượt đã thực hiện</span>
              <span class="text-2xl font-bold text-white">319</span>
            </div>
          </div>
          <div class="bg-[#152122] border border-[#223335] rounded-2xl p-4 space-y-2 text-xs text-slate-400">
            <h4 class="text-xs font-bold text-white uppercase">Về ứng dụng</h4>
            <p>Phiên bản 1.6.2 · Thang điểm Waterlow (bản sửa đổi 2005), phân độ tổn thương theo NPIAP/EPUAP.</p>
          </div>
        </div>
      `;
    }

    // Hàm render tổng
    function render() {
      const main = document.getElementById('main-content');
      if (currentTab === 'home') main.innerHTML = renderHomeTab();
      else if (currentTab === 'tasks') main.innerHTML = renderTasksTab();
      else if (currentTab === 'patients') main.innerHTML = renderPatientsTab();
      else if (currentTab === 'handover') main.innerHTML = renderHandoverTab();
      else if (currentTab === 'account') main.innerHTML = renderAccountTab();

      // Cập nhật số badge đỏ
      const badge = document.getElementById('nav-task-badge');
      const count = patients.filter(p => p.status === 'treating' && p.notes).length;
      if (count > 0) {
        badge.innerText = count;
        badge.classList.remove('hidden');
      } else {
        badge.classList.add('hidden');
      }
    }

    // Chạy render khởi động
    render();
  </script>
</body>
</html>
