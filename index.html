    function App() {
      const [isLoggedIn, setIsLoggedIn] = useState(true);
      const [currentUser, setCurrentUser] = useState({ name: "Trần Văn An", role: "Điều dưỡng", username: "dd.an" });

      // Modal & View States
      const [viewMode, setViewMode] = useState("card"); // 'card' | 'table'
      const [showSortMenu, setShowSortMenu] = useState(false);
      const [showTimeMenu, setShowTimeMenu] = useState(false);
      const [selectedSort, setSelectedSort] = useState("Ưu tiên chăm sóc");
      const [selectedTime, setSelectedTime] = useState("Mọi thời điểm");
      const [searchQuery, setSearchQuery] = useState("");
      const [patientTabFilter, setPatientTabFilter] = useState("treating"); // 'treating' | 'discharged' | 'all'

      // Bộ lọc riêng cho tab Cần lưu ý
      const [taskFilter, setTaskFilter] = useState("all"); // 'all' | 'turn' | 'assessment' | 'notes'
      const [taskSearchQuery, setTaskSearchQuery] = useState("");
      const [taskSort, setTaskSort] = useState("Ưu tiên chăm sóc");
      const [taskTime, setTaskTime] = useState("Mọi thời điểm");
      const [showTaskSortMenu, setShowTaskSortMenu] = useState(false);
      const [showTaskTimeMenu, setShowTaskTimeMenu] = useState(false);

      // Thang điểm Waterlow Modal State
      const [waterlowModalPatient, setWaterlowModalPatient] = useState(null);
      const [newPatientModalOpen, setNewPatientModalOpen] = useState(false);
      const [toastMessage, setToastMessage] = useState("");

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(""), 2500);
      };

      // Xoay trở cả buồng
      const handleBulkTurn = () => {
        setPatients(prev => prev.map(p => ({
          ...p,
          lastTurnHours: 0,
          turnsLast24h: p.turnsLast24h + 1
        })));
        showToast("Đã ghi xoay trở thành công cho cả buồng!");
      };

      // Xoay trở 1 người bệnh
      const handleSingleTurn = (patientId) => {
        setPatients(prev => prev.map(p => p.id === patientId ? {
          ...p,
          lastTurnHours: 0,
          turnsLast24h: p.turnsLast24h + 1
        } : p));
        showToast("Đã ghi nhận xoay trở người bệnh!");
      };

      // Xử lý lưu ý của người bệnh
      const handleResolveNote = (patientId) => {
        setPatients(prev => prev.map(p => p.id === patientId ? {
          ...p,
          unhandledNotes: 0,
          noteContent: ""
        } : p));
        showToast("Đã xác nhận xử lý lưu ý!");
      };

      // Render Badge Nguy Cơ
      const renderRiskBadge = (level, score) => {
        if (!level || level === "Chưa đánh giá") {
          return <span className="text-[11px] px-2 py-0.5 rounded-full bg-slate-800 text-slate-300 font-medium border border-slate-700">Chưa đánh giá</span>;
        }
        if (level === "Nguy cơ rất cao") {
          return <span className="text-[11px] px-2 py-0.5 rounded-full bg-[#3c1820] text-[#f87171] font-medium border border-[#dc2626]/40 flex items-center gap-1.5"><span className="w-1.5 h-1.5 rounded-full bg-red-500 animate-pulse"></span>Nguy cơ rất cao</span>;
        }
        if (level === "Nguy cơ cao") {
          return <span className="text-[11px] px-2 py-0.5 rounded-full bg-[#352516] text-[#fb923c] font-medium border border-[#ea580c]/40 flex items-center gap-1.5"><span className="w-1.5 h-1.5 rounded-full bg-orange-500"></span>Nguy cơ cao</span>;
        }
        return <span className="text-[11px] px-2 py-0.5 rounded-full bg-[#302b16] text-[#facc15] font-medium border border-[#ca8a04]/40 flex items-center gap-1.5"><span className="w-1.5 h-1.5 rounded-full bg-yellow-500"></span>Có nguy cơ</span>;
      };

      // Danh sách Người bệnh sau khi lọc & sắp xếp
      const filteredPatients = useMemo(() => {
        return patients
          .filter(p => {
            if (patientTabFilter === "treating") return p.status === "treating";
            if (patientTabFilter === "discharged") return p.status === "discharged";
            return true;
          })
          .filter(p => {
            if (!searchQuery.trim()) return true;
            const q = searchQuery.toLowerCase();
            return p.name.toLowerCase().includes(q) || p.code.toLowerCase().includes(q) || p.bed.toLowerCase().includes(q);
          })
          .sort((a, b) => {
            if (selectedSort === "Tên A → Z") return a.name.localeCompare(b.name, 'vi');
            if (selectedSort === "Tên Z → A") return b.name.localeCompare(a.name, 'vi');
            if (selectedSort === "Theo giường") return a.bed.localeCompare(b.bed);
            if (selectedSort === "Điểm Waterlow cao nhất") return (b.waterlow || 0) - (a.waterlow || 0);
            // Default "Ưu tiên chăm sóc"
            return (b.waterlow || 0) - (a.waterlow || 0);
          });
      }, [patients, patientTabFilter, searchQuery, selectedSort]);

      // Danh sách Cần lưu ý / Việc cần làm sau khi lọc & sắp xếp
      const filteredTaskPatients = useMemo(() => {
        return patients
          .filter(p => p.status === "treating")
          .filter(p => {
            if (!taskSearchQuery.trim()) return true;
            const q = taskSearchQuery.toLowerCase();
            return p.name.toLowerCase().includes(q) || p.code.toLowerCase().includes(q) || p.bed.toLowerCase().includes(q);
          })
          .filter(p => {
            if (taskFilter === "turn") return p.lastTurnHours >= p.turnTargetHours;
            if (taskFilter === "assessment") return p.overdueAssessment || !p.waterlow;
            if (taskFilter === "notes") return p.unhandledNotes > 0;
            return true; // "all"
          })
          .sort((a, b) => {
            if (taskSort === "Tên A → Z") return a.name.localeCompare(b.name, 'vi');
            if (taskSort === "Tên Z → A") return b.name.localeCompare(a.name, 'vi');
            if (taskSort === "Theo giường") return a.bed.localeCompare(b.bed);
            if (taskSort === "Điểm Waterlow cao nhất") return (b.waterlow || 0) - (a.waterlow || 0);
            if (taskSort === "Quá hạn nhiều nhất") return (b.lastTurnHours || 0) - (a.lastTurnHours || 0);
            return (b.waterlow || 0) - (a.waterlow || 0);
          });
      }, [patients, taskFilter, taskSearchQuery, taskSort]);

      // Thống kê nhanh
      const highRiskCount = patients.filter(p => p.status === "treating" && (p.riskLevel === "Nguy cơ rất cao" || p.riskLevel === "Nguy cơ cao")).length;

            <h1 className="text-xl font-bold text-slate-100 text-center">Đánh giá & theo dõi loét tì đè</h1>

            <div className="w-full bg-[#162021] border border-[#243335] rounded-2xl p-5 shadow-xl space-y-4">

                  placeholder="vd: dd.an"
                />
              </div>

              <div>
                <label className="text-xs text-slate-400 mb-1.5 block">Mật khẩu</label>
                <input
                  type="password"
                  defaultValue="123456"
                  className="w-full bg-[#101718] border border-[#2b3c3e] rounded-xl px-3.5 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-teal-400"

                />
              </div>

              <div className="bg-[#122223] border border-[#1b3e3e] rounded-xl p-3 text-xs text-slate-300 flex items-start gap-2.5 leading-relaxed">
                <span className="text-teal-400 mt-0.5">ℹ</span>
                <span>Đăng nhập bằng tài khoản riêng của bạn đồng nghĩa với việc <strong>ký xác nhận</strong> mọi thao tác thực hiện sau đó. Không dùng chung tài khoản.</span>
              </div>

              <button
                onClick={() => setIsLoggedIn(true)}
                className="w-full bg-teal-500 hover:bg-teal-400 text-slate-950 font-semibold py-3 rounded-xl transition duration-150 shadow-md text-sm mt-2"

                Đăng nhập
              </button>
            </div>

              <p className="mt-1">Đăng nhập: <code className="text-teal-300">ddt.chau</code> (điều dưỡng trưởng) hoặc <code className="text-teal-300">dd.an</code> — mật khẩu <code className="text-teal-300">123456</code></p>
              <button className="mt-3 w-full py-2 bg-[#1b2628] hover:bg-[#233134] text-slate-200 border border-[#2d3e40] rounded-lg font-medium text-xs">
                Nối vào kho dữ liệu của khoa
              </button>
            </div>
          </div>
        );

      // ----------------------------------------------------
      return (

                {currentTab === "patients" && "Người bệnh"}
                {currentTab === "tasks" && "Cần lưu ý"}
                {currentTab === "handover" && "Giao ban ca"}
                {currentTab === "account" && "Tài khoản"}

                  <h2 className="text-lg font-bold text-white">Chào buổi sáng, An</h2>

                            </li>
                          ) : (
                            <li className="flex items-start gap-1.5 text-teal-400">
                              <span className="font-bold">•</span>
                              <span>Đã xoay trở đúng hạn</span>
                            </li>
                          )}
                        </ul>

                        {/* Hàng 4: 3 nút hành động nhanh */}
                        <div className="grid grid-cols-3 gap-2 pt-1.5">
                          <button
                            onClick={() => handleSingleTurn(p.id)}
                            className="bg-teal-500 hover:bg-teal-400 text-slate-950 font-bold py-2 rounded-xl text-xs transition text-center shadow-sm"
                          >
                            Ghi xoay trở
                          </button>

                          <button
                            onClick={() => setWaterlowModalPatient(p)}
                            className="bg-[#1f2d2f] hover:bg-[#283b3d] text-slate-200 border border-[#2d4042] font-semibold py-2 rounded-xl text-xs transition text-center"
                          >
                            Đánh giá
                          </button>

                          <button
                            onClick={() => {
                              if (p.unhandledNotes > 0) {
                                handleResolveNote(p.id);
                              } else {
                                showToast(`Mở hồ sơ bệnh án của ${p.name}`);
                              }
                            }}
                            className="bg-[#1f2d2f] hover:bg-[#283b3d] text-slate-200 border border-[#2d4042] font-semibold py-2 rounded-xl text-xs transition text-center"
                          >
                            {p.unhandledNotes > 0 ? "Xem lưu ý" : "Mở hồ sơ"}
                          </button>
                        </div>
                      </div>
                    ))
                  )}
                </div>
              </div>
            )}

            {/* ======================================================== */}
            {/* TAB 4: GIAO BAN                                          */}
            {/* ======================================================== */}
            {currentTab === "handover" && (
              <div className="space-y-4">
                <div className="bg-[#152122] border border-[#223335] rounded-2xl p-4">
                  <div className="flex items-center gap-2 mb-2">
                    <span className="w-1.5 h-3.5 bg-teal-400 rounded-full"></span>
                    <h3 className="text-sm font-bold text-white">Sổ giao ban ca trực ICU</h3>
                  </div>
                  <p className="text-xs text-slate-400 mb-3">Tổng hợp nguy cơ loét tì đè và bàn giao chăm sóc ca trực.</p>

                  <div className="bg-[#11191a] border border-[#202e30] rounded-xl p-3 text-xs space-y-2 text-slate-300">
                    <div className="flex justify-between">
                      <span className="text-slate-400">Tổng số người bệnh:</span>
                      <span className="font-bold text-white">12</span>
                    </div>
                    <div className="flex justify-between">
                      <span className="text-slate-400">Nguy cơ rất cao (Waterlow ≥ 20):</span>
                      <span className="font-bold text-red-400">{patients.filter(p=>p.waterlow >= 20).length}</span>
                    </div>
                    <div className="flex justify-between">
                      <span className="text-slate-400">Đang có tổn thương da / tì đè:</span>
                      <span className="font-bold text-orange-400">{patients.filter(p=>p.injuries > 0).length}</span>
                    </div>
                    <div className="flex justify-between">
                      <span className="text-slate-400">Lưu ý chưa bàn giao xong:</span>
                      <span className="font-bold text-yellow-400">{unhandledNotesCount}</span>
                    </div>
                  </div>

                  <div className="mt-4">
                    <label className="text-xs text-slate-400 mb-1 block">Nội dung ghi chú ca trực</label>
                    <textarea
                      rows="3"
                      placeholder="Nhập nội dung dặn dò ca sau về các ca loét tì đè nặng..."
                      className="w-full bg-[#11191a] border border-[#25383a] rounded-xl p-3 text-xs text-slate-200 focus:outline-none focus:border-teal-400"
                    ></textarea>
                  </div>

                  <button
                    onClick={() => showToast("Đã lưu biên bản giao ban thành công!")}
                    className="w-full mt-3 bg-teal-500 hover:bg-teal-400 text-slate-950 font-bold py-2.5 rounded-xl text-xs transition"
                  >
                    Ký xác nhận bàn giao ca
                  </button>
                </div>
              </div>
            )}

            {/* ======================================================== */}
            {/* TAB 5: TÀI KHOẢN                                         */}
            {/* ======================================================== */}
            {currentTab === "account" && (
              <div className="space-y-3">
                {/* Thông tin cá nhân */}
                <div className="bg-[#152122] border border-[#223335] rounded-2xl p-4 flex items-center gap-3.5">
                  <div className="w-12 h-12 rounded-xl bg-teal-500/20 border border-teal-500/30 text-teal-400 flex items-center justify-center font-bold text-lg">
                    {currentUser.name.charAt(0)}
                  </div>
                  <div>
                    <h3 className="text-base font-bold text-white">{currentUser.name}</h3>
                    <p className="text-xs text-slate-400">{currentUser.role} · {currentUser.username}</p>
                  </div>
                </div>

                {/* Thống kê cá nhân */}
                <div className="grid grid-cols-2 gap-2.5">
                  <div className="bg-[#152122] border border-[#223335] rounded-2xl p-3.5">
                    <span className="text-xs text-slate-400 block mb-1">Lượt đánh giá hôm nay</span>
                    <span className="text-2xl font-bold text-white">0</span>
                  </div>
                  <div className="bg-[#152122] border border-[#223335] rounded-2xl p-3.5">
                    <span className="text-xs text-slate-400 block mb-1">Tổng lượt đã thực hiện</span>
                    <span className="text-2xl font-bold text-white">319</span>
                  </div>
                </div>

                {/* Bảo Mật */}
                <div className="bg-[#152122] border border-[#223335] rounded-2xl p-4 space-y-3">
                  <div className="flex items-center gap-1.5">
                    <span className="w-1.5 h-3.5 bg-teal-400 rounded-full"></span>
                    <h4 className="text-xs font-bold text-white uppercase tracking-wider">Bảo mật</h4>
                  </div>
                  <div className="flex gap-2">
                    <button 
                      onClick={() => showToast("Chức năng đổi mật khẩu đang kết nối máy chủ BV")}
                      className="flex-1 bg-[#1c2a2c] hover:bg-[#25373a] text-slate-200 border border-[#2a3c3e] py-2 rounded-xl text-xs font-semibold"
                    >
                      Đổi mật khẩu
                    </button>
                    <button 
                      onClick={() => setIsLoggedIn(false)}
                      className="flex-1 bg-[#2e181c] hover:bg-[#3d1e24] text-rose-300 border border-[#4d232a] py-2 rounded-xl text-xs font-semibold"
                    >
                      Đăng xuất
                    </button>
                  </div>
                  <p className="text-[11px] text-slate-400 leading-relaxed pt-1">
                    Hệ thống tự khoá sau 20 phút không thao tác. Mọi lượt đánh giá đều lưu tên và thời điểm của người thực hiện, không thể sửa hay xoá.
                  </p>
                </div>

                {/* Về ứng dụng */}
                <div className="bg-[#152122] border border-[#223335] rounded-2xl p-4 space-y-2 text-xs text-slate-300">
                  <div className="flex items-center gap-1.5">
                    <span className="w-1.5 h-3.5 bg-teal-400 rounded-full"></span>
                    <h4 className="text-xs font-bold text-white uppercase tracking-wider">Về ứng dụng</h4>
                  </div>
                  <p className="leading-relaxed text-slate-400 text-[11px]">
                    Phiên bản 1.6.2 · Thang điểm <strong>Waterlow</strong> (bản sửa đổi 2005), phân độ tổn thương theo <strong>NPIAP/EPUAP</strong>. Ứng dụng hỗ trợ ghi nhận và theo dõi, <strong>không thay thế</strong> đánh giá lâm sàng trực tiếp của điều dưỡng và bác sĩ.
                  </p>
                  <p className="text-[11px] text-teal-400 pt-1">
                    Chế độ dữ liệu: <strong>Lưu trên máy này</strong>
                  </p>
                </div>
              </div>
            )}
          </main>

          {/* ======================================================== */}
          {/* MODAL THANG ĐIỂM WATERLOW (CALCULATOR)                   */}
          {/* ======================================================== */}
          {waterlowModalPatient && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
              <div className="w-full max-w-md bg-[#131d1e] border border-[#27393b] rounded-t-3xl sm:rounded-3xl max-h-[90vh] flex flex-col overflow-hidden shadow-2xl animate-in slide-in-from-bottom duration-200">
                {/* Modal Header */}
                <div className="px-5 py-3.5 border-b border-[#213032] flex justify-between items-center bg-[#172325]">
                  <div>
                    <h3 className="text-sm font-bold text-white">Đánh giá thang điểm Waterlow</h3>
                    <p className="text-[11px] text-teal-400">{waterlowModalPatient.name} — {waterlowModalPatient.bed}</p>
                  </div>
                  <button 
                    onClick={() => setWaterlowModalPatient(null)}
                    className="p-1 rounded-lg text-slate-400 hover:text-white"
                  >
                    ✕
                  </button>
                </div>

                {/* Modal Content - Waterlow criteria */}
                <div className="p-4 overflow-y-auto space-y-4 text-xs">
                  <div className="bg-[#172324] border border-[#27383a] p-3 rounded-xl">
                    <span className="font-semibold text-teal-300 block mb-1">Quy định phân loại thang điểm Waterlow:</span>
                    <div className="grid grid-cols-3 gap-1 text-[10px] text-center mt-2">
                      <div className="p-1.5 rounded bg-yellow-950/40 text-yellow-300 border border-yellow-800/40">10-14: Có nguy cơ</div>
                      <div className="p-1.5 rounded bg-orange-950/40 text-orange-300 border border-orange-800/40">15-19: Nguy cơ cao</div>
                      <div className="p-1.5 rounded bg-red-950/40 text-red-300 border border-red-800/40">≥20: Rất cao</div>
                    </div>
                  </div>

                  {/* 1. Thể trạng & Chiều cao */}
                  <div>
                    <label className="font-semibold text-slate-200 block mb-1.5">1. Xây dựng thể trạng / BMI</label>
                    <select className="w-full bg-[#172223] border border-[#273739] rounded-xl p-2.5 text-xs text-slate-200">
                      <option>Trung bình (BMI 20 - 24.9) — 0 điểm</option>
                      <option>Trên trung bình (BMI 25 - 29.9) — 1 điểm</option>
                      <option>Béo phì (BMI ≥ 30) — 2 điểm</option>
                      <option>Dưới trung bình (BMI < 20) — 3 điểm</option>
                    </select>
                  </div>

                  {/* 2. Loại da */}
                  <div>
                    <label className="font-semibold text-slate-200 block mb-1.5">2. Tình trạng da ở các vùng nguy cơ</label>
                    <select className="w-full bg-[#172223] border border-[#273739] rounded-xl p-2.5 text-xs text-slate-200">
                      <option>Khỏe mạnh — 0 điểm</option>
                      <option>Mỏng manh như giấy lá hành — 1 điểm</option>
                      <option>Khô ráp — 1 điểm</option>
                      <option>Phù nề — 1 điểm</option>
                      <option>Ứ đọng / đổi màu — 2 điểm</option>
                      <option>Nứt nẻ / có vết loét độ I, II — 3 điểm</option>
                    </select>
                  </div>

                  {/* 3. Giới tính & Tuổi */}
                  <div>
                    <label className="font-semibold text-slate-200 block mb-1.5">3. Độ tuổi</label>
                    <select className="w-full bg-[#172223] border border-[#273739] rounded-xl p-2.5 text-xs text-slate-200">
                      <option>14 - 49 tuổi — 1 điểm</option>
                      <option>50 - 64 tuổi — 2 điểm</option>
                      <option>65 - 74 tuổi — 3 điểm</option>
                      <option>75 - 80 tuổi — 4 điểm</option>
                      <option>≥ 81 tuổi — 5 điểm</option>
                    </select>
                  </div>

                  {/* 4. Khả năng vận động */}
                  <div>
                    <label className="font-semibold text-slate-200 block mb-1.5">4. Khả năng vận động</label>
                    <select className="w-full bg-[#172223] border border-[#273739] rounded-xl p-2.5 text-xs text-slate-200">
                      <option>Hoàn toàn bình thường — 0 điểm</option>
                      <option>Bồn chồn / ngọ nguậy — 1 điểm</option>
                      <option>Lãnh đạm / thờ ơ — 2 điểm</option>
                      <option>Hạn chế cử động — 3 điểm</option>
                      <option>Nằm liệt giường / Bất động ICU — 4 điểm</option>
                      <option>Ngồi xe lăn — 5 điểm</option>
                    </select>
                  </div>
                </div>

                {/* Modal Footer */}
                <div className="p-4 border-t border-[#233335] bg-[#172324] flex gap-2">
                  <button
                    onClick={() => setWaterlowModalPatient(null)}
                    className="flex-1 py-2.5 bg-[#202e30] text-slate-300 font-semibold rounded-xl text-xs"
                  >
                    Hủy
                  </button>
                  <button
                    onClick={() => {
                      setPatients(prev => prev.map(p => p.id === waterlowModalPatient.id ? {
                        ...p,
                        overdueAssessment: null
                      } : p));
                      setWaterlowModalPatient(null);
                      showToast("Đã lưu kết quả đánh giá thang điểm Waterlow!");
                    }}
                    className="flex-1 py-2.5 bg-teal-500 hover:bg-teal-400 text-slate-950 font-bold rounded-xl text-xs transition"
                  >
                    Lưu kết quả
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ======================================================== */}
          {/* MODAL THÊM HỒ SƠ MỚI                                     */}
          {/* ======================================================== */}
          {newPatientModalOpen && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="w-full max-w-sm bg-[#131d1e] border border-[#27393b] rounded-2xl overflow-hidden shadow-2xl p-5 space-y-3 text-xs">
                <h3 className="text-sm font-bold text-white mb-2">Thêm hồ sơ người bệnh mới</h3>
                <div>
                  <label className="text-slate-400 block mb-1">Họ và tên</label>
                  <input type="text" placeholder="vd: Trần Văn Bình" className="w-full bg-[#182324] border border-[#263738] rounded-xl px-3 py-2 text-white" />
                </div>
                <div className="grid grid-cols-2 gap-2">
                  <div>
                    <label className="text-slate-400 block mb-1">Tuổi</label>
                    <input type="number" placeholder="60" className="w-full bg-[#182324] border border-[#263738] rounded-xl px-3 py-2 text-white" />
                  </div>
                  <div>
                    <label className="text-slate-400 block mb-1">Giường (ICU)</label>
                    <input type="text" placeholder="HS-13" className="w-full bg-[#182324] border border-[#263738] rounded-xl px-3 py-2 text-white" />
                  </div>
                </div>
                <div>
                  <label className="text-slate-400 block mb-1">Mã hồ sơ</label>
                  <input type="text" placeholder="26-040250" className="w-full bg-[#182324] border border-[#263738] rounded-xl px-3 py-2 text-white" />
                </div>
                <div className="flex gap-2 pt-2">
                  <button onClick={() => setNewPatientModalOpen(false)} className="flex-1 py-2 bg-[#202e30] text-slate-300 font-semibold rounded-xl">Hủy</button>
                  <button 
                    onClick={() => { setNewPatientModalOpen(false); showToast("Đã thêm hồ sơ người bệnh!"); }} 
                    className="flex-1 py-2 bg-teal-500 font-bold text-slate-950 rounded-xl"
                  >
                    Tạo mới
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ======================================================== */}
          {/* BOTTOM NAVIGATION BAR (5 TAB CHUẨN)                     */}
          {/* ======================================================== */}
          <nav className="fixed bottom-0 max-w-md w-full bg-[#0d1415]/95 backdrop-blur-md border-t border-[#1c292b] px-2 py-2 flex justify-around items-center z-40">
            {/* 1. Trang chủ */}
            <button
              onClick={() => setCurrentTab("home")}
              className={`flex flex-col items-center gap-1 transition ${currentTab === "home" ? "text-teal-400 font-bold" : "text-slate-400 hover:text-slate-200"}`}
            >
              <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
              <span className="text-[10px]">Trang chủ</span>
            </button>

            {/* 2. Người bệnh */}
            <button
              onClick={() => setCurrentTab("patients")}
              className={`flex flex-col items-center gap-1 transition ${currentTab === "patients" ? "text-teal-400 font-bold" : "text-slate-400 hover:text-slate-200"}`}
            >
              <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
              <span className="text-[10px]">Người bệnh</span>
            </button>

            {/* 3. Cần lưu ý (Việc cần làm) - Kèm Badge đỏ */}
            <button
              onClick={() => setCurrentTab("tasks")}
              className={`flex flex-col items-center gap-1 relative transition ${currentTab === "tasks" ? "text-teal-400 font-bold" : "text-slate-400 hover:text-slate-200"}`}
            >
              <div className="relative">
                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 21v-4m0 0V5a2 2 0 012-2h6.5l1 1H21l-3 6 3 6h-8.5l-1-1H5a2 2 0 00-2 2zm9-13.5V9"/></svg>
                {unhandledNotesCount > 0 && (
                  <span className="absolute -top-1 -right-2 bg-rose-500 text-white text-[9px] font-bold w-4 h-4 rounded-full flex items-center justify-center border-2 border-[#0d1415]">
                    {unhandledNotesCount}
                  </span>
                )}
              </div>
              <span className="text-[10px]">Cần lưu ý</span>
            </button>

            {/* 4. Giao ban */}
            <button
              onClick={() => setCurrentTab("handover")}
              className={`flex flex-col items-center gap-1 transition ${currentTab === "handover" ? "text-teal-400 font-bold" : "text-slate-400 hover:text-slate-200"}`}
            >
              <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
              <span className="text-[10px]">Giao ban</span>
            </button>

            {/* 5. Tài khoản */}
            <button
              onClick={() => setCurrentTab("account")}
              className={`flex flex-col items-center gap-1 transition ${currentTab === "account" ? "text-teal-400 font-bold" : "text-slate-400 hover:text-slate-200"}`}
            >
              <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
              <span className="text-[10px]">Tài khoản</span>
            </button>
          </nav>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
