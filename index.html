<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Theo Dõi Loét Tì Đè - ICU BV Bệnh Nhiệt Đới</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #050808;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .custom-scroll::-webkit-scrollbar { display: none; }
    .custom-scroll { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="flex justify-center min-h-screen">
  <div id="app" class="w-full max-w-md bg-[#0d1415] min-h-screen pb-24 relative shadow-2xl flex flex-col">
    <!-- Header -->
    <header class="px-4 pt-4 pb-2.5 flex justify-between items-center bg-[#0d1415] sticky top-0 z-30 border-b border-[#1c292b]">
      <div>
        <h1 id="page-title" class="text-lg font-bold text-white tracking-tight">Cần lưu ý</h1>
        <p id="page-subtitle" class="text-[11px] text-slate-400">Bệnh viện Bệnh Nhiệt đới</p>
      </div>
      <button class="p-2 rounded-xl bg-[#172223] text-slate-300 border border-[#233133]">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" /></svg>
      </button>
    </header>

    <!-- Main Content Area -->
    <main id="main-content" class="flex-1 px-4 py-3"></main>

    <!-- Bottom Navigation -->
    <nav class="fixed bottom-0 max-w-md w-full bg-[#0d1415]/95 backdrop-blur-md border-t border-[#1c292b] px-2 py-2 flex justify-around items-center z-40">
      <button onclick="changeTab('home')" id="nav-home" class="flex flex-col items-center gap-1 text-slate-400">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
        <span class="text-[10px]">Trang chủ</span>
      </button>
      <button onclick="changeTab('patients')" id="nav-patients" class="flex flex-col items-center gap-1 text-slate-400">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
        <span class="text-[10px]">Người bệnh</span>
      </button>
      <button onclick="changeTab('tasks')" id="nav-tasks" class="flex flex-col items-center gap-1 text-teal-400 font-bold relative">
        <div class="relative">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 21v-4m0 0V5a2 2 0 012-2h6.5l1 1H21l-3 6 3 6h-8.5l-1-1H5a2 2 0 00-2 2zm9-13.5V9"/></svg>
          <span id="nav-task-badge" class="absolute -top-1 -right-2 bg-rose-500 text-white text-[9px] font-bold w-4 h-4 rounded-full flex items-center justify-center border border-[#0d1415]">2</span>
        </div>
        <span class="text-[10px]">Cần lưu ý</span>
      </button>
      <button onclick="changeTab('handover')" id="nav-handover" class="flex flex-col items-center gap-1 text-slate-400">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
        <span class="text-[10px]">Giao ban</span>
      </button>
      <button onclick="changeTab('account')" id="nav-account" class="flex flex-col items-center gap-1 text-slate-400">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
        <span class="text-[10px]">Tài khoản</span>
      </button>
    </nav>

    <!-- Toast Notification -->
    <div id="toast" class="hidden fixed top-5 left-1/2 -translate-x-1/2 z-50 bg-teal-500 text-slate-950 px-4 py-2 rounded-full font-bold text-xs shadow-2xl transition"></div>
  </div>

  <script>
    // Dữ liệu người bệnh & việc cần làm
    let patients = [
      { id: "HS-04", code: "26-040235", name: "Phạm Hữu Hùng", bed: "HS-04", age: 65, waterlow: 19, riskLevel: "Nguy cơ cao", daysOverdueTurn: "2 ngày 13 giờ", turnTarget: 2, overdueAssessment: "Quá hạn đánh giá 4 ngày 13 giờ", notes: "1 lưu ý chưa tiếp nhận", noteDetail: "Kiểm tra đỏ vùng cùng cụt", days: 8, turns24h: 0 },
      { id: "HS-02", code: "26-040233", name: "Phan Đức Thắng", bed: "HS-02", age: 60, waterlow: 20, riskLevel: "Nguy cơ rất cao", daysOverdueTurn: "2 ngày 13 giờ", turnTarget: 2, overdueAssessment: "Quá hạn đánh giá 2 ngày 5 giờ", notes: "1 lưu ý chưa ghi kết quả", noteDetail: "Dán băng gạc hydrocolloid", days: 10, turns24h: 0 },
      { id: "HS-09", code: "26-040240", name: "Nguyễn Minh Nam", bed: "HS-09", age: 55, waterlow: null, riskLevel: "Chưa đánh giá", daysOverdueTurn: "2 ngày 13 giờ", turnTarget: 3, overdueAssessment: "Chưa đánh giá lần đầu", notes: "", noteDetail: "", days: 3, turns24h: 0 },
      { id: "HS-03", code: "26-040234", name: "Phạm Thu Linh", bed: "HS-03", age: 49, waterlow: 23, riskLevel: "Nguy cơ rất cao", daysOverdueTurn: "3 ngày 13 giờ", turnTarget: 2, overdueAssessment: "Quá hạn đánh giá 3 ngày 13 giờ", notes: "", noteDetail: "", days: 17, turns24h: 0 },
      { id: "HS-08", code: "26-040239", name: "Nguyễn Thị Dung", bed: "HS-08", age: 49, waterlow: 23, riskLevel: "Nguy cơ rất cao", daysOverdueTurn: "3 ngày 15 giờ", turnTarget: 2, overdueAssessment: "Quá hạn 3 ngày 15 giờ", notes: "", noteDetail: "", days: 9, turns24h: 0 },
      { id: "HS-11", code: "26-040242", name: "Đỗ Ngọc Hoa", bed: "HS-11", age: 71, waterlow: 31, riskLevel: "Nguy cơ rất cao", daysOverdueTurn: "3 ngày 14 giờ", turnTarget: 2, overdueAssessment: "Quá hạn 3 ngày 14 giờ", notes: "", noteDetail: "", days: 13, turns24h: 0 },
      { id: "HS-10", code: "26-040241", name: "Nguyễn Thanh Khoa", bed: "HS-10", age: 42, waterlow: 29, riskLevel: "Nguy cơ rất cao", daysOverdueTurn: "3 ngày 12 giờ", turnTarget: 2, overdueAssessment: "Quá hạn 3 ngày 12 giờ", notes: "", noteDetail: "", days: 16, turns24h: 0 },
      { id: "HS-12", code: "26-040243", name: "Ngô Thanh Chi", bed: "HS-12", age: 52, waterlow: 14, riskLevel: "Có nguy cơ", daysOverdueTurn: "3 ngày 20 giờ", turnTarget: 3, overdueAssessment: "Quá hạn 3 ngày 20 giờ", notes: "", noteDetail: "", days: 10, turns24h: 0 }
    ];

    let currentTab = 'tasks'; // Mặc định mở ngay tab Cần lưu ý
    let taskFilter = 'all'; // all | turn | assess | note
    let taskSearch = '';
    let taskTime = 'Mọi thời điểm';
    let taskSort = 'Ưu tiên chăm sóc';
    let patientViewMode = 'card'; // card | table

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.innerText = msg;
      toast.classList.remove('hidden');
      setTimeout(() => { toast.classList.add('hidden'); }, 2200);
    }

    function changeTab(tab) {
      currentTab = tab;
      // Cập nhật icon active
      ['home', 'patients', 'tasks', 'handover', 'account'].forEach(t => {
        const btn = document.getElementById(`nav-${t}`);
        if (t === tab) {
          btn.className = "flex flex-col items-center gap-1 text-teal-400 font-bold relative";
        } else {
          btn.className = "flex flex-col items-center gap-1 text-slate-400";
        }
      });

      const title = document.getElementById('page-title');
      const sub = document.getElementById('page-subtitle');
      if (tab === 'tasks') {
        title.innerText = 'Cần lưu ý';
        sub.innerText = 'Khoa Hồi sức tích cực';
      } else if (tab === 'patients') {
        title.innerText = 'Người bệnh';
        sub.innerText = `${patients.length} đang điều trị`;
      } else if (tab === 'home') {
        title.innerText = 'Tổng quan';
        sub.innerText = 'Bệnh viện Bệnh Nhiệt đới';
      } else if (tab === 'handover') {
        title.innerText = 'Giao ban ca';
        sub.innerText = 'Khoa Hồi sức tích cực';
      } else {
        title.innerText = 'Tài khoản';
        sub.innerText = 'Bệnh viện Bệnh Nhiệt đới';
      }
      render();
    }

    function renderRiskBadge(risk) {
      if (risk === "Nguy cơ rất cao") {
        return `<span class="text-[11px] px-2.5 py-0.5 rounded-full bg-[#3c1820] text-[#f87171] font-semibold border border-[#dc2626]/40 flex items-center gap-1.5"><span class="w-1.5 h-1.5 rounded-full bg-red-500"></span>Nguy cơ rất cao</span>`;
      }
      if (risk === "Nguy cơ cao") {
        return `<span class="text-[11px] px-2.5 py-0.5 rounded-full bg-[#352516] text-[#fb923c] font-semibold border border-[#ea580c]/40 flex items-center gap-1.5"><span class="w-1.5 h-1.5 rounded-full bg-orange-500"></span>Nguy cơ cao</span>`;
      }
      if (risk === "Có nguy cơ") {
        return `<span class="text-[11px] px-2.5 py-0.5 rounded-full bg-[#302b16] text-[#facc15] font-semibold border border-[#ca8a04]/40 flex items-center gap-1.5"><span class="w-1.5 h-1.5 rounded-full bg-yellow-500"></span>Có nguy cơ</span>`;
      }
      return `<span class="text-[11px] px-2.5 py-0.5 rounded-full bg-slate-800 text-slate-300 font-semibold border border-slate-700">Chưa đánh giá</span>`;
    }

    // Ghi xoay trở
    function actionTurn(id) {
      const p = patients.find(x => x.id === id);
      if (p) {
        p.daysOverdueTurn = "Vừa xoay trở";
        p.turns24h += 1;
        showToast(`Đã ghi xoay trở giường ${p.bed} - ${p.name}!`);
        render();
      }
    }

    // Đánh giá
    function actionAssess(id) {
      const p = patients.find(x => x.id === id);
      if (p) {
        p.overdueAssessment = null;
        if (!p.waterlow) { p.waterlow = 21; p.riskLevel = "Nguy cơ rất cao"; }
        showToast(`Đã hoàn tất đánh giá Waterlow cho ${p.name}!`);
        render();
      }
    }

    // Xem / xử lý lưu ý
    function actionNote(id) {
      const p = patients.find(x => x.id === id);
      if (p) {
        p.notes = "";
        showToast(`Đã tiếp nhận lưu ý chăm sóc ${p.bed}!`);
        render();
      }
    }

    function renderTasksTab() {
      // Lọc danh sách
      let list = [...patients];
      if (taskSearch.trim()) {
        const q = taskSearch.toLowerCase();
        list = list.filter(p => p.name.toLowerCase().includes(q) || p.bed.toLowerCase().includes(q) || p.code.toLowerCase().includes(q));
      }
      if (taskFilter === 'turn') {
        list = list.filter(p => p.daysOverdueTurn !== "Vừa xoay trở");
      } else if (taskFilter === 'assess') {
        list = list.filter(p => p.overdueAssessment);
      } else if (taskFilter === 'note') {
        list = list.filter(p => p.notes);
      }

      // Sắp xếp
      if (taskSort === 'Tên A → Z') list.sort((a,b) => a.name.localeCompare(b.name, 'vi'));
      else if (taskSort === 'Theo giường') list.sort((a,b) => a.bed.localeCompare(b.bed));
      else if (taskSort === 'Điểm Waterlow cao nhất') list.sort((a,b) => (b.waterlow||0) - (a.waterlow||0));
      else list.sort((a,b) => (b.waterlow||0) - (a.waterlow||0));

      return `
        <div class="space-y-3">
          <!-- Tiêu đề & số ca trễ -->
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-1.5">
              <span class="w-1.5 h-4 bg-teal-400 rounded-full"></span>
              <h2 class="text-base font-bold text-white tracking-tight">Việc cần làm</h2>
            </div>
            <span class="text-xs text-rose-400 font-semibold bg-rose-950/40 border border-rose-800/40 px-2.5 py-0.5 rounded-full">
              ${patients.filter(p => p.overdueAssessment || p.notes).length} đang trễ
            </span>
          </div>

          <!-- Thanh tìm kiếm -->
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-500">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
            </span>
            <input
              type="text"
              id="task-search-input"
              value="${taskSearch}"
              placeholder="Tìm theo tên hoặc mã hồ sơ"
              oninput="taskSearch = this.value; renderTasksListOnly();"
              class="w-full bg-[#152122] border border-[#223335] rounded-xl pl-9 pr-3 py-2 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-teal-400"
            />
          </div>

          <!-- Bộ 4 nút lọc công việc -->
          <div class="grid grid-cols-4 gap-1 bg-[#121c1d] p-1 rounded-xl border border-[#1f2d2f] text-[11px]">
            <button onclick="taskFilter='all'; render();" class="py-1.5 rounded-lg transition text-center ${taskFilter==='all'?'bg-teal-500 text-slate-950 font-bold':'text-slate-400'}">Tất cả</button>
            <button onclick="taskFilter='turn'; render();" class="py-1.5 rounded-lg transition text-center ${taskFilter==='turn'?'bg-teal-500 text-slate-950 font-bold':'text-slate-400'}">Xoay trở</button>
            <button onclick="taskFilter='assess'; render();" class="py-1.5 rounded-lg transition text-center ${taskFilter==='assess'?'bg-teal-500 text-slate-950 font-bold':'text-slate-400'}">Đánh giá</button>
            <button onclick="taskFilter='note'; render();" class="py-1.5 rounded-lg transition text-center ${taskFilter==='note'?'bg-teal-500 text-slate-950 font-bold':'text-slate-400'}">Lưu ý</button>
          </div>

          <!-- Dropdown Thời gian & Sắp xếp -->
          <div class="grid grid-cols-2 gap-2 text-xs">
            <div>
              <span class="text-[11px] text-slate-400 mb-1 block">Thời gian</span>
              <select onchange="taskTime=this.value; render();" class="w-full bg-[#152122] border border-[#243436] rounded-xl px-2.5 py-2 text-slate-200 focus:outline-none">
                <option ${taskTime==='Mọi thời điểm'?'selected':''}>Mọi thời điểm</option>
                <option ${taskTime==='24 giờ qua'?'selected':''}>24 giờ qua</option>
                <option ${taskTime==='3 ngày gần nhất'?'selected':''}>3 ngày gần nhất</option>
                <option ${taskTime==='7 ngày gần nhất'?'selected':''}>7 ngày gần nhất</option>
              </select>
            </div>
            <div>
              <span class="text-[11px] text-slate-400 mb-1 block">Sắp xếp</span>
              <select onchange="taskSort=this.value; render();" class="w-full bg-[#152122] border border-[#243436] rounded-xl px-2.5 py-2 text-slate-200 focus:outline-none">
                <option ${taskSort==='Ưu tiên chăm sóc'?'selected':''}>Ưu tiên chăm sóc</option>
                <option ${taskSort==='Điểm Waterlow cao nhất'?'selected':''}>Điểm Waterlow cao nhất</option>
                <option ${taskSort==='Theo giường'?'selected':''}>Theo giường</option>
                <option ${taskSort==='Tên A → Z'?'selected':''}>Tên A → Z</option>
              </select>
            </div>
          </div>

          <!-- Danh sách thẻ việc cần làm -->
          <div id="tasks-list" class="space-y-3 pt-1">
            ${list.map(p => `
              <div class="bg-[#152122] border border-[#233335] rounded-2xl p-4 space-y-2.5 shadow-sm">
                <!-- Header Card -->
                <div class="flex items-center justify-between flex-wrap gap-2">
                  <div class="flex items-center gap-2">
                    <span class="text-[11px] font-semibold text-slate-300 bg-[#1c2a2c] px-2 py-0.5 rounded-md border border-[#2b3d40]">
                      ${p.bed}
                    </span>
                    <h3 class="text-sm font-bold text-white">${p.name}</h3>
                  </div>
                  <div>${renderRiskBadge(p.riskLevel)}</div>
                </div>

                <!-- Waterlow pill -->
                <div>
                  <span class="inline-block bg-[#1a2729] text-slate-300 text-[10px] font-medium px-2 py-0.5 rounded border border-[#25383a]">
                    Waterlow ${p.waterlow !== null ? p.waterlow : '--'}
                  </span>
                </div>

                <!-- Danh sách cảnh báo chi tiết -->
                <ul class="text-xs space-y-1 text-slate-300 pt-0.5">
                  ${p.notes ? `
                    <li class="flex items-start gap-1.5 text-[#fb923c]">
                      <span class="text-orange-400 font-bold">•</span>
                      <span>${p.notes} ${p.noteDetail ? `(${p.noteDetail})` : ''}</span>
                    </li>
                  ` : ''}

                  ${p.overdueAssessment ? `
                    <li class="flex items-start gap-1.5 text-[#f87171]">
                      <span class="text-red-400 font-bold">•</span>
                      <span>${p.overdueAssessment}</span>
                    </li>
                  ` : ''}

                  <li class="flex items-start gap-1.5 text-[#fb923c]">
                    <span class="text-orange-400 font-bold">•</span>
                    <span>${p.daysOverdueTurn === 'Vừa xoay trở' ? 'Đã xoay trở đúng hạn' : `Đã ${p.daysOverdueTurn} chưa xoay — mục tiêu mỗi ${p.turnTarget} giờ`}</span>
                  </li>
                </ul>

                <!-- 3 Nút Thao Tác Nhanh -->
                <div class="grid grid-cols-3 gap-2 pt-1.5">
                  <button onclick="actionTurn('${p.id}')" class="bg-teal-500 hover:bg-teal-400 text-slate-950 font-bold py-2 rounded-xl text-xs text-center shadow-sm">
                    Ghi xoay trở
                  </button>
                  <button onclick="actionAssess('${p.id}')" class="bg-[#1f2d2f] hover:bg-[#283b3d] text-slate-200 border border-[#2d4042] font-semibold py-2 rounded-xl text-xs text-center">
                    Đánh giá
                  </button>
                  <button onclick="actionNote('${p.id}')" class="bg-[#1f2d2f] hover:bg-[#283b3d] text-slate-200 border border-[#2d4042] font-semibold py-2 rounded-xl text-xs text-center">
                    ${p.notes ? 'Xem lưu ý' : 'Mở hồ sơ'}
                  </button>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function renderTasksListOnly() {
      const container = document.getElementById('tasks-list');
      if (!container) return;
      let list = [...patients];
      if (taskSearch.trim()) {
        const q = taskSearch.toLowerCase();
        list = list.filter(p => p.name.toLowerCase().includes(q) || p.bed.toLowerCase().includes(q) || p.code.toLowerCase().includes(q));
      }
      container.innerHTML = list.map(p => `
        <div class="bg-[#152122] border border-[#233335] rounded-2xl p-4 space-y-2.5 shadow-sm">
          <div class="flex items-center justify-between flex-wrap gap-2">
            <div class="flex items-center gap-2">
              <span class="text-[11px] font-semibold text-slate-300 bg-[#1c2a2c] px-2 py-0.5 rounded-md border border-[#2b3d40]">${p.bed}</span>
              <h3 class="text-sm font-bold text-white">${p.name}</h3>
            </div>
            <div>${renderRiskBadge(p.riskLevel)}</div>
          </div>
          <div>
            <span class="inline-block bg-[#1a2729] text-slate-300 text-[10px] font-medium px-2 py-0.5 rounded border border-[#25383a]">Waterlow ${p.waterlow !== null ? p.waterlow : '--'}</span>
          </div>
          <ul class="text-xs space-y-1 text-slate-300 pt-0.5">
            ${p.notes ? `<li class="flex items-start gap-1.5 text-[#fb923c]"><span class="text-orange-400 font-bold">•</span><span>${p.notes}</span></li>` : ''}
            ${p.overdueAssessment ? `<li class="flex items-start gap-1.5 text-[#f87171]"><span class="text-red-400 font-bold">•</span><span>${p.overdueAssessment}</span></li>` : ''}
            <li class="flex items-start gap-1.5 text-[#fb923c]"><span class="text-orange-400 font-bold">•</span><span>Đã ${p.daysOverdueTurn} chưa xoay — mục tiêu mỗi ${p.turnTarget} giờ</span></li>
          </ul>
          <div class="grid grid-cols-3 gap-2 pt-1.5">
            <button onclick="actionTurn('${p.id}')" class="bg-teal-500 text-slate-950 font-bold py-2 rounded-xl text-xs">Ghi xoay trở</button>
            <button onclick="actionAssess('${p.id}')" class="bg-[#1f2d2f] text-slate-200 border border-[#2d4042] font-semibold py-2 rounded-xl text-xs">Đánh giá</button>
            <button onclick="actionNote('${p.id}')" class="bg-[#1f2d2f] text-slate-200 border border-[#2d4042] font-semibold py-2 rounded-xl text-xs">${p.notes ? 'Xem lưu ý' : 'Mở hồ sơ'}</button>
          </div>
        </div>
      `).join('');
    }

    function renderHomeTab() {
      return `
        <div class="space-y-4">
          <div class="bg-[#141e1f] border border-[#223133] rounded-2xl p-4">
            <span class="text-[10px] font-semibold text-teal-400 uppercase tracking-wider block mb-0.5">Khoa Hồi Sức Tích Cực</span>
            <h2 class="text-lg font-bold text-white">Chào buổi sáng, An</h2>
            <p class="text-xs text-slate-400 mt-1">Điều dưỡng · phiên làm việc 26/09/2026</p>
          </div>
          <div class="grid grid-cols-2 gap-2.5">
            <div class="bg-[#152122] border border-[#223335] rounded-2xl p-3">
              <span class="text-xs text-slate-400 block mb-1">Người bệnh điều trị</span>
              <div class="text-2xl font-bold text-white">12</div>
              <span class="text-[11px] text-red-400 mt-1 block">9 ca nguy cơ rất cao</span>
            </div>
            <div class="bg-[#152122] border border-[#223335] rounded-2xl p-3">
              <span class="text-xs text-slate-400 block mb-1">Đến hạn đánh giá</span>
              <div class="text-2xl font-bold text-orange-400">12</div>
              <span class="text-[11px] text-slate-400 mt-1 block">1 ca chưa đánh giá</span>
            </div>
            <div class="bg-[#152122] border border-[#223335] rounded-2xl p-3">
              <span class="text-xs text-slate-400 block mb-1">Đã tới lúc xoay trở</span>
              <div class="text-2xl font-bold text-orange-400">12</div>
              <span class="text-[11px] text-slate-400 mt-1 block">quá mục tiêu khoa</span>
            </div>
            <div class="bg-[#152122] border border-[#223335] rounded-2xl p-3">
              <span class="text-xs text-slate-400 block mb-1">Cần lưu ý chưa xử lý</span>
              <div class="text-2xl font-bold text-red-400">2</div>
              <span class="text-[11px] text-slate-400 mt-1 block">2 mục chưa tiếp nhận</span>
            </div>
          </div>
          <div class="space-y-2 pt-1">
            <div class="flex items-center gap-1.5">
              <span class="w-1 h-3.5 bg-teal-400 rounded-full"></span>
              <h3 class="text-sm font-semibold text-white">Xoay trở buồng bệnh</h3>
            </div>
            <button onclick="patients.forEach(p=>p.daysOverdueTurn='Vừa xoay'); showToast('Đã ghi xoay trở cả buồng!'); render();" class="w-full bg-[#f97316] hover:bg-[#ea580c] text-white font-bold py-3.5 rounded-2xl shadow-lg text-sm flex items-center justify-center gap-2">
              Ghi xoay trở cả buồng (12 người bệnh)
            </button>
          </div>
        </div>
      `;
    }

    function renderPatientsTab() {
      return `
        <div class="space-y-3">
          <div class="flex gap-2">
            <input type="text" placeholder="Tìm theo tên hoặc mã hồ sơ" class="w-full bg-[#152122] border border-[#223335] rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none" />
            <button onclick="showToast('Thêm hồ sơ mới!')" class="bg-teal-500 text-slate-950 font-bold px-3 py-2 rounded-xl text-xs shrink-0">+ Hồ sơ mới</button>
          </div>
          <div class="flex justify-end">
            <div class="bg-[#121c1d] border border-[#202f31] rounded-xl p-0.5 flex">
              <button onclick="patientViewMode='card'; render();" class="px-3 py-1 rounded-lg text-xs ${patientViewMode==='card'?'bg-teal-500 text-slate-950 font-bold':'text-slate-400'}">Thẻ</button>
              <button onclick="patientViewMode='table'; render();" class="px-3 py-1 rounded-lg text-xs ${patientViewMode==='table'?'bg-teal-500 text-slate-950 font-bold':'text-slate-400'}">Bảng</button>
            </div>
          </div>
          ${patientViewMode === 'card' ? `
            <div class="space-y-2.5">
              ${patients.map(p => `
                <div class="bg-[#162122] border border-[#233335] rounded-2xl p-3.5 flex justify-between items-center relative overflow-hidden">
                  <div class="absolute left-0 top-0 bottom-0 w-1 bg-rose-500"></div>
                  <div class="pl-1">
                    <h4 class="text-sm font-bold text-white">${p.name}</h4>
                    <div class="text-[11px] text-slate-400 flex items-center gap-2 mt-0.5">
                      <span>${p.code}</span> · <span>${p.age} tuổi</span> · <span class="text-teal-300 font-semibold">${p.bed}</span>
                    </div>
                    <div class="text-[11px] text-rose-400 font-medium mt-1">${p.daysOverdueTurn}</div>
                  </div>
                  <div class="text-right bg-[#1c2a2c] px-3 py-1.5 rounded-xl border border-[#2b3e40]">
                    <div class="text-xl font-bold text-slate-100">${p.waterlow ?? '--'}</div>
                    <span class="text-[9px] font-semibold text-slate-400 uppercase">WATERLOW</span>
                  </div>
                </div>
              `).join('')}
            </div>
          ` : `
            <div class="bg-[#141e1f] border border-[#223335] rounded-2xl overflow-x-auto">
              <table class="w-full text-left text-xs text-slate-300">
                <thead class="bg-[#182526] text-[10px] text-slate-400 uppercase border-b border-[#233335]">
                  <tr><th class="py-2.5 px-3">Người bệnh</th><th class="py-2.5 px-2">Giường</th><th class="py-2.5 px-2">Waterlow</th><th class="py-2.5 px-3">Mức độ</th></tr>
                </thead>
                <tbody class="divide-y divide-[#1e2c2e]">
                  ${patients.map(p => `
                    <tr>
                      <td class="py-2.5 px-3 font-semibold text-white whitespace-nowrap">${p.name}</td>
                      <td class="py-2.5 px-2 text-teal-300 whitespace-nowrap">${p.bed}</td>
                      <td class="py-2.5 px-2 font-bold whitespace-nowrap">${p.waterlow ?? '--'}</td>
                      <td class="py-2.5 px-3 whitespace-nowrap">${renderRiskBadge(p.riskLevel)}</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          `}
        </div>
      `;
    }

    function renderHandoverTab() {
      return `
        <div class="bg-[#152122] border border-[#223335] rounded-2xl p-4 space-y-3">
          <h3 class="text-sm font-bold text-white">Sổ giao ban ca trực ICU</h3>
          <p class="text-xs text-slate-400">Tổng hợp nguy cơ loét tì đè và bàn giao chăm sóc ca trực.</p>
          <div class="bg-[#11191a] border border-[#202e30] rounded-xl p-3 text-xs space-y-2 text-slate-300">
            <div class="flex justify-between"><span class="text-slate-400">Tổng số người bệnh:</span><span class="font-bold text-white">12</span></div>
            <div class="flex justify-between"><span class="text-slate-400">Nguy cơ rất cao (≥ 20):</span><span class="font-bold text-red-400">9</span></div>
          </div>
          <textarea rows="3" placeholder="Nhập dặn dò ca sau..." class="w-full bg-[#11191a] border border-[#25383a] rounded-xl p-3 text-xs text-slate-200 focus:outline-none"></textarea>
          <button onclick="showToast('Đã lưu bàn giao ca!');" class="w-full bg-teal-500 font-bold text-slate-950 py-2.5 rounded-xl text-xs">Ký xác nhận bàn giao ca</button>
        </div>
      `;
    }

    function renderAccountTab() {
      return `
        <div class="space-y-3">
          <div class="bg-[#152122] border border-[#223335] rounded-2xl p-4 flex items-center gap-3">
            <div class="w-12 h-12 rounded-xl bg-teal-500/20 text-teal-400 flex items-center justify-center font-bold text-lg">A</div>
            <div>
              <h3 class="text-base font-bold text-white">Trần Văn An</h3>
              <p class="text-xs text-slate-400">Điều dưỡng · dd.an</p>
            </div>
          </div>
          <div class="grid grid-cols-2 gap-2.5">
            <div class="bg-[#152122] border border-[#223335] rounded-2xl p-3.5">
              <span class="text-xs text-slate-400 block mb-1">Lượt đánh giá hôm nay</span>
              <span class="text-2xl font-bold text-white">0</span>
            </div>
            <div class="bg-[#152122] border border-[#223335] rounded-2xl p-3.5">
              <span class="text-xs text-slate-400 block mb-1">Tổng lượt đã thực hiện</span>
              <span class="text-2xl font-bold text-white">319</span>
            </div>
          </div>
          <div class="bg-[#152122] border border-[#223335] rounded-2xl p-4 space-y-2 text-xs text-slate-400">
            <h4 class="text-xs font-bold text-white uppercase">Về ứng dụng</h4>
            <p>Phiên bản 1.6.2 · Thang điểm Waterlow (bản sửa đổi 2005), phân độ tổn thương theo NPIAP/EPUAP.</p>
          </div>
        </div>
      `;
    }

    function render() {
      const main = document.getElementById('main-content');
      if (currentTab === 'tasks') main.innerHTML = renderTasksTab();
      else if (currentTab === 'home') main.innerHTML = renderHomeTab();
      else if (currentTab === 'patients') main.innerHTML = renderPatientsTab();
      else if (currentTab === 'handover') main.innerHTML = renderHandoverTab();
      else if (currentTab === 'account') main.innerHTML = renderAccountTab();

      // Cập nhật số badge đỏ
      const badge = document.getElementById('nav-task-badge');
      const count = patients.filter(p => p.notes).length;
      if (count > 0) {
        badge.innerText = count;
        badge.classList.remove('hidden');
      } else {
        badge.classList.add('hidden');
      }
    }

    // Khởi động render ngay lập tức khi tải trang
    render();
  </script>
</body>
</html>
